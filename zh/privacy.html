   這支 setLang 不再寫 localStorage。 */
function setLang(l) {
  /* 鎖定頁不再寫 localStorage,語言以網址為準 */
  var bEn = document.getElementById('btnEn'), bZh = document.getElementById('btnZh');
  if (bEn) bEn.classList.toggle('active', l === 'en');
  if (bZh) bZh.classList.toggle('active', l === 'zh');
  const t = T[l];
  let html = '<h1>' + t.title + '</h1><div class="updated">' + t.updated + '</div>';
  t.sections.forEach(s => {
    if (s.h) html += '<h2>' + s.h + '</h2>';
    if (s.p) html += '<p>' + s.p + '</p>';
  });
  document.getElementById('content').innerHTML = html;
  const fc = document.getElementById('footer-copy');
  if (fc) fc.textContent = t.copy;
  document.documentElement.lang = (l === 'zh') ? 'zh-Hant' : 'en';
}

const lang = (window.DCA_LANG === 'zh') ? 'zh' : 'en';   // 由網址鎖定,不再讀 localStorage
