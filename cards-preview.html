<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  try{
    var s = location.search || '';
    if(/[?&]desktop=0(\b|$)/.test(s)){ localStorage.removeItem('forceDesktop'); }
    else if(/[?&]desktop=1(\b|$)/.test(s)){ localStorage.setItem('forceDesktop','1'); }
    if(localStorage.getItem('forceDesktop')==='1'){
      var vp = document.querySelector('meta[name="viewport"]');
      if(vp){ vp.setAttribute('content','width=1200'); }
    }
  }catch(e){}
})();
</script>
<title>卡片列 桌機版 · 示意</title>
<style>
:root{
  --ink:#1d1d1f; --ink2:#6e6a62; --ink3:#a5a29a;
  --line:#ececE6; --line2:#f2f0ea; --bg:#fbfbfa; --bg2:#f2efe8; --card:#fff;
  --up:#1a9e5f; --down:#e0463c; --score:#f08a24;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Helvetica Neue",Arial,sans-serif;
  --gut:max(40px, calc((100% - 1200px) / 2));
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg2);font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);}

.nav{height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;background:#fff;border-bottom:1px solid var(--line2);}
.nav .brand{font-size:19px;font-weight:800;letter-spacing:-.4px;}
.nav .brand i{font-style:normal;color:#c8813a;}
.nav .ver{font-size:11px;color:var(--ink3);margin-left:9px;font-weight:600;}
.nav .burger{width:20px;height:14px;position:relative;opacity:.75;}
.nav .burger span{position:absolute;left:0;right:0;height:1.6px;border-radius:2px;background:var(--ink);}
.nav .burger span:nth-child(1){top:0}.nav .burger span:nth-child(2){top:6.2px}.nav .burger span:nth-child(3){top:12.4px}

#secBD{padding:80px 0;}
.gut{padding-left:var(--gut);padding-right:var(--gut);}
.eyebrow{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:12px;}
.sec-title{font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1.16;text-align:center;margin-bottom:10px;}
.sec-sub{font-size:16px;color:var(--ink2);text-align:center;line-height:1.7;max-width:660px;margin:0 auto 40px;}
.block-t{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;margin:0;}

/* ── 標題列 + 箭頭 ── */
.railhead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:52px 0 18px;}
.railnav{display:flex;gap:10px;}
.railnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--ink2);font-size:17px;line-height:1;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
.railnav button:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink);}
.railnav button:disabled{opacity:.28;cursor:default;}
/* 排得下、沒東西可滑 → 整組箭頭消失,不留一個點了沒反應的按鈕 */
.railnav.is-idle{display:none;}

/* ── 橫滑列 ── */
.rail{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-left:var(--gut);padding-right:0;scroll-padding-left:var(--gut);
  padding-bottom:6px;}
.rail::-webkit-scrollbar{display:none;}
.rail > *:last-child{margin-right:var(--gut);}

/* ── 數據卡 ──
   對齊的三個關鍵:
   ① .s-top 預留兩行固定高度 → 標題一行或兩行,數字都落在同一條基線
   ② .s-note 用 margin-top:auto 推到底 → 說明一行或兩行,卡片底部都齊
   ③ 卡片在 flex 列裡預設等高,上緣本來就齊
   文字變多是往卡片內部吸收,卡片高度不變。 */
.scard{flex:0 0 258px;scroll-snap-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:22px;padding:24px 24px 22px;
  box-shadow:0 1px 2px rgba(20,20,15,.04),0 9px 24px rgba(20,20,15,.055);
  display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:232px;}
.s-top{font-size:13px;color:var(--ink3);font-weight:600;line-height:1.45;
  min-height:calc(13px * 1.45 * 2);}          /* 預留兩行 */
.s-num{display:flex;align-items:flex-end;gap:6px;margin-top:14px;flex-wrap:nowrap;}
.s-num .v{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:.9;
  font-variant-numeric:tabular-nums;color:var(--valc,#1d1d1f);}
.s-num .u{font-size:14px;font-weight:700;color:var(--ink2);padding-bottom:4px;white-space:nowrap;}
.s-g{font-size:13.5px;font-weight:800;margin-top:8px;white-space:nowrap;min-height:calc(13.5px * 1.2);}
.up{color:var(--up);} .down{color:var(--down);}
.s-note{font-size:13px;color:var(--ink3);line-height:1.55;margin-top:auto;padding-top:18px;}

/* ── 五訊號卡(同一套對齊原則)── */
#secF{padding:80px 0;background:var(--bg);}
.fcard{flex:0 0 300px;scroll-snap-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:22px;padding:24px;
  box-shadow:0 1px 2px rgba(20,20,15,.04),0 9px 24px rgba(20,20,15,.055);
  display:flex;flex-direction:column;min-height:392px;}
.fcard .k{font-size:12px;letter-spacing:.4px;color:var(--ink3);font-weight:600;
  line-height:1.4;min-height:calc(12px * 1.4 * 2);}
.fcard .viz{height:112px;display:flex;align-items:center;justify-content:center;margin:6px 0 10px;}
.fcard .viz svg{width:100%;height:100%;overflow:visible;}
.fcard .bignum{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:.9;text-align:center;
  font-variant-numeric:tabular-nums;}
.fcard .auxi{font-size:13px;color:var(--ink3);text-align:center;margin-top:10px;
  line-height:1.45;min-height:calc(13px * 1.45 * 2);}
.fcard .hr{height:1px;background:var(--line2);margin:16px 0;}
.fcard .analysis{font-size:22px;font-weight:900;text-align:center;letter-spacing:2px;}
.fcard .fnote{font-size:13px;color:var(--ink3);line-height:1.55;text-align:center;
  margin-top:auto;padding-top:10px;}
</style>
</head>
<body>

<div class="nav">
  <div class="brand">DCA<i>café</i><span class="ver">cards 1</span></div>
  <div class="burger"><span></span><span></span><span></span></div>
</div>

<!-- 五訊號:五張,一定滑得動 → 箭頭出現 -->
<section id="secF">
  <div class="gut">
    <div class="eyebrow">關鍵訊號來源</div>
    <h2 class="sec-title">矚目焦點，合為一體。</h2>
    <p class="sec-sub">五個關鍵訊號驅動合成獨一無二的 DCA Score。</p>
  </div>
  <div class="gut"><div class="railhead" style="margin-top:0">
    <div class="block-t">五個訊號</div>
    <div class="railnav" data-rail="fRail"><button data-d="-1">‹</button><button data-d="1">›</button></div>
  </div></div>
  <div class="rail" id="fRail"></div>
</section>

<section id="secBD">
  <div class="gut">
    <div class="eyebrow">數據小學堂</div>
    <h2 class="sec-title">價值，經得起細細看。</h2>
    <p class="sec-sub">讓現實數字呈現眼前，任你所用。</p>
  </div>

  <!-- 賺錢能力:五張 → 滑得動,箭頭出現 -->
  <div class="gut"><div class="railhead">
    <div class="block-t">賺錢能力</div>
    <div class="railnav" data-rail="eRail"><button data-d="-1">‹</button><button data-d="1">›</button></div>
  </div></div>
  <div class="rail" id="eRail"></div>

  <!-- 風險與交易:四張 → 排得下,箭頭整組消失 -->
  <div class="gut"><div class="railhead">
    <div class="block-t">風險與交易</div>
    <div class="railnav" data-rail="rRail"><button data-d="-1">‹</button><button data-d="1">›</button></div>
  </div></div>
  <div class="rail" id="rRail"></div>
</section>

<script>
/* 假資料:標題刻意做成一行與兩行混雜,說明句也長短不一,用來檢查對齊 */
var EARN=[
 {top:'公司整體值多少（含兩行標題）',v:'4.75',u:'兆',note:'規模越大通常越穩健，波動也相對小一些。'},
 {top:'本益比 P/E',v:'42.3',u:'倍',note:'市場願意為它每賺 1 元付的價格。'},
 {top:'每股盈餘 EPS',v:'7.49',u:'美元',g:'+23%',gUp:true,note:'每股一年賺多少。'},
 {top:'年營收',v:'4,162',u:'億',g:'+6%',gUp:true,note:'一整年做多少生意，數字越大代表規模越大。'},
 {top:'淨利率',v:'27.6',u:'%',note:'每做 100 元生意實拿多少。'}
];
var RISK=[
 {top:'殖利率',v:'0.33',u:'%',note:'每年股息約佔股價的比例。'},
 {top:'52 週最高',v:'$340',c:'var(--up)',note:'過去一年股價的最高點。'},
 {top:'52 週最低',v:'$227',c:'var(--down)',note:'過去一年股價的最低點，跌破就是新低。'},
 {top:'毛利率',v:'48.7',u:'%',note:'扣掉成本後每 100 元剩多少。'}
];
function scard(d){
  return '<div class="scard">'
   + '<div class="s-top">'+d.top+'</div>'
   + '<div class="s-num"><span class="v"'+(d.c?' style="--valc:'+d.c+'"':'')+'>'+d.v+'</span>'
   + (d.u?'<span class="u">'+d.u+'</span>':'')+'</div>'
   + '<div class="s-g '+(d.gUp?'up':'down')+'">'+(d.g||'')+'</div>'
   + '<div class="s-note">'+d.note+'</div></div>';
}
document.getElementById('eRail').innerHTML=EARN.map(scard).join('');
document.getElementById('rRail').innerHTML=RISK.map(scard).join('');

var FACTORS=[
 {k:'MA200 · 200 週均線乖離（兩行標題測試）',num:'+18%',aux:'近十年第 72 百分位',lab:'偏高',col:'#c06a5c',note:'離長期成本線還有一段距離。'},
 {k:'RSI · 相對強弱',num:'34',aux:'近十年第 34 百分位',lab:'偏冷',col:'#5c9b6b',note:'買氣退得比大多數時候更冷，這通常是好事。'},
 {k:'DD · 回撤',num:'−12%',aux:'近十年第 71 百分位',lab:'不錯',col:'#5c9b6b',note:'跌得比七成的日子還深。'},
 {k:'VIX · 波動指數',num:'21.4',aux:'近十年第 46 百分位',lab:'普通',col:'#c08a3a',note:'市場情緒沒有特別緊張。'},
 {k:'P/FCF · 自由現金流倍數',num:'31',aux:'近五年第 62 百分位',lab:'偏貴',col:'#c06a5c',note:'估值仍在自己的中上緣。'}
];
function bars(pct){var b='';for(var i=0;i<11;i++){var h=18+Math.abs(Math.sin(i*0.9))*62;var on=(i/10)<=pct;
  b+='<rect x="'+(i*28+6)+'" y="'+(100-h)+'" width="17" height="'+h+'" rx="5" fill="'+(on?'#d69f5c':'#eeeae1')+'"/>';}
  return '<svg viewBox="0 0 320 110">'+b+'</svg>';}
document.getElementById('fRail').innerHTML=FACTORS.map(function(f,i){
  return '<div class="fcard"><div class="k">'+f.k+'</div>'
   +'<div class="viz">'+bars([.72,.34,.71,.46,.62][i])+'</div>'
   +'<div class="bignum">'+f.num+'</div><div class="auxi">'+f.aux+'</div>'
   +'<div class="hr"></div><div class="analysis" style="color:'+f.col+'">'+f.lab+'</div>'
   +'<div class="fnote">'+f.note+'</div></div>';
}).join('');

/* ══ 箭頭:自己判斷有沒有東西可滑 ══
   排得下 → 整組隱藏;滑到頭 → 那一邊變淡並停用。
   換資產、換語言、視窗變寬變窄都會自動重算。 */
(function(){
  function sync(nav){
    var rail = document.getElementById(nav.getAttribute('data-rail'));
    if(!rail) return;
    var max = rail.scrollWidth - rail.clientWidth;
    if(max <= 2){ nav.classList.add('is-idle'); return; }
    nav.classList.remove('is-idle');
    var x = rail.scrollLeft;
    nav.querySelector('[data-d="-1"]').disabled = x <= 1;
    nav.querySelector('[data-d="1"]').disabled  = x >= max - 1;
  }
  function syncAll(){ document.querySelectorAll('.railnav').forEach(sync); }
  document.querySelectorAll('.railnav').forEach(function(nav){
    var rail = document.getElementById(nav.getAttribute('data-rail'));
    if(rail) rail.addEventListener('scroll', function(){ sync(nav); });
    nav.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b || b.disabled) return;
      var card = rail.firstElementChild;
      var step = card ? (card.getBoundingClientRect().width + 22) : 300;
      rail.scrollBy({ left: (b.getAttribute('data-d')==='-1' ? -step : step), behavior:'smooth' });
    });
  });
  window.addEventListener('resize', syncAll);
  window.addEventListener('load', syncAll);
  syncAll(); setTimeout(syncAll, 300);
})();
</script>
</body>
</html>
