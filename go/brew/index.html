<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DCAcafé</title>
<!--
  短網址轉址頁（每日 Brew Shorts 說明欄；?t=代號 → 資產頁，?q=代號 → 首頁計算機）。
  語言只看手機的語言設定：中文 → 中文版，其他 → 英文版。
  轉址時帶上 UTM 標記，GA4 才分得出是從哪裡來的。
  沒有 JavaScript 時，下面的 meta refresh 會直接帶到英文版。
  lang-ok：這頁本身就是語言判斷的入口，刻意寫死中英文兩個目的地。
-->
<meta http-equiv="refresh" content="2; url=/?utm_source=youtube&amp;utm_medium=shorts&amp;utm_campaign=brew">
<script>
(function () {
  var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
  var zh = String(langs[0] || '').toLowerCase().indexOf('zh') === 0;
  var p = {};
  try { p = Object.fromEntries(new URLSearchParams(location.search)); } catch (e) {}
  var t = String(p.t || '').toLowerCase().replace(/[^a-z0-9\-]/g, '');
  var qq = String(p.q || '').toUpperCase().replace(/[^A-Z0-9.\-^=]/g, '');
  var code = (t || qq).toUpperCase();
  var dest = zh ? '/zh/' : '/';
  if (t) dest = (zh ? '/zh' : '') + '/asset/' + t + '.html';
  var q = (qq ? 'ticker=' + encodeURIComponent(qq) + '&' : '') +
          'utm_source=youtube&utm_medium=shorts&utm_campaign=brew' +
          (code ? '&utm_content=' + encodeURIComponent(code) : '');
  location.replace(dest + '?' + q);
})();
</script>
<style>html,body{margin:0;height:100%;background:#0f0d0b;color:#f4ece0;font:16px/1.5 -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}a{color:#e0a55c}</style>
</head>
<body>
<p><a href="/">DCAcafé</a></p>
</body>
</html>
