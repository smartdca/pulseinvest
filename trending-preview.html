<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人氣熱搜 · 預覽 — DCAcafé</title>
<style>
:root{
  --ink:#1d1d1f; --ink2:#6e6a62; --ink3:#a5a29a;
  --line:#ececE6; --line2:#f2f0ea; --bg:#fbfbfa;
  --accent:#c8813a;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang TC','Helvetica Neue',Arial,sans-serif;
  --navh:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;}
body{overflow-x:hidden;}

/* ── 假頁首(正式版由 chrome.js 注入,這裡只是為了讓高度接近真實)── */
.fakenav{height:var(--navh);display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:rgba(251,251,250,.86);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line2);
  position:sticky;top:0;z-index:60;}
.fakenav .brand{font-size:17px;font-weight:700;letter-spacing:-.4px;}
.fakenav .brand i{font-style:normal;color:var(--accent);}
.fakenav .ver{font-size:10px;color:var(--ink3);margin-left:8px;letter-spacing:.4px;font-weight:600;}
.fakenav .burger{width:20px;height:14px;position:relative;opacity:.75;}
.fakenav .burger span{position:absolute;left:0;right:0;height:1.6px;border-radius:2px;background:var(--ink);}
.fakenav .burger span:nth-child(1){top:0}.fakenav .burger span:nth-child(2){top:6.2px}.fakenav .burger span:nth-child(3){top:12.4px}

/* ── 舞台:剛好一個視窗高,泡泡永遠不會超出畫面 ── */
.stage{position:relative;height:calc(100svh - var(--navh));min-height:520px;overflow:hidden;
  background:
    radial-gradient(120% 85% at 50% 8%, #ffffff 0%, rgba(255,255,255,0) 62%),
    radial-gradient(95% 70% at 18% 96%, #f6efe2 0%, rgba(246,239,226,0) 70%),
    radial-gradient(90% 70% at 88% 88%, #eff0ee 0%, rgba(239,240,238,0) 72%),
    #f7f5f1;}

/* ── HERO:一開始置中,泡泡浮上來之後淡掉 ── */
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  padding:0 34px;text-align:center;z-index:4;
  transition:opacity 1.5s ease 1.1s, transform 1.6s ease 1.1s;}
.hero h1{font-size:31px;font-weight:680;line-height:1.2;letter-spacing:-1px;margin-bottom:14px;text-wrap:balance;}
.hero p{font-size:14.5px;line-height:1.75;color:var(--ink2);max-width:340px;margin:0 auto;text-wrap:pretty;}
.stage.risen .hero{opacity:0;transform:translateY(-58%);pointer-events:none;}

/* 啟動泡泡:跟場上的泡泡同一個質感,按下去沉下去,泡泡群浮上來 */
.startb{margin:30px auto 0;width:126px;height:126px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(255,255,255,.85);font-family:inherit;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:0 20px;
  font-size:14px;font-weight:650;line-height:1.45;color:#4b463d;letter-spacing:-.2px;
  background:
    radial-gradient(78% 62% at 30% 22%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.42) 46%, rgba(255,255,255,.10) 74%),
    radial-gradient(120% 120% at 70% 92%, rgba(200,129,58,.15) 0%, rgba(200,129,58,0) 58%),
    rgba(255,255,255,.30);
  backdrop-filter:blur(7px) saturate(135%);-webkit-backdrop-filter:blur(7px) saturate(135%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.95), inset 0 -10px 22px rgba(150,128,96,.14),
    inset 0 8px 20px rgba(255,255,255,.55), 0 12px 30px rgba(74,56,26,.12);
  transition:transform 1.4s cubic-bezier(.5,0,.9,.4), opacity 1.1s ease;}
.startb::before{content:'';position:absolute;left:11%;top:7%;width:44%;height:30%;border-radius:50%;
  background:linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,0) 72%);
  filter:blur(1.5px);pointer-events:none;}
.startb::after{content:'';position:absolute;top:-20%;bottom:-20%;left:0;width:42%;
  background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 45%, rgba(255,255,255,.62) 50%, rgba(255,255,255,.34) 55%, rgba(255,255,255,0) 100%);
  transform:translateX(-160%) skewX(-12deg);animation:bubShine 12s ease-in-out infinite 1.2s;pointer-events:none;}
.startb:active{transform:scale(.96);}
.stage.risen .startb{transform:translateY(46vh) scale(.7);opacity:0;}

/* ── 泡泡場 ──
   啟動前泡泡雖然已經在 HTML 裡(SEO 需要),但它們是看不見的,
   絕對不能吃到點擊——否則會蓋住 Hero 的啟動鈕,亂點還會開到資產頁。 */
.field{position:absolute;inset:0;z-index:2;pointer-events:none;}
.field.go{pointer-events:auto;}
.bub{position:absolute;border-radius:50%;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:
    radial-gradient(78% 62% at 30% 22%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.42) 46%, rgba(255,255,255,.10) 74%),
    radial-gradient(120% 120% at 70% 92%, rgba(200,129,58,.13) 0%, rgba(200,129,58,0) 58%),
    rgba(255,255,255,.30);
  backdrop-filter:blur(7px) saturate(135%);-webkit-backdrop-filter:blur(7px) saturate(135%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.95),
    inset 0 -10px 22px rgba(150,128,96,.14),
    inset 0 8px 20px rgba(255,255,255,.55),
    0 10px 26px rgba(74,56,26,.10),
    0 2px 6px rgba(74,56,26,.06);
  overflow:hidden;
  opacity:0;}
.field.go .bub{opacity:1;}
.bub:active{filter:brightness(.97);}

/* 靜態反光:左上角一小塊,像玻璃球 */
.bub::before{content:'';position:absolute;left:11%;top:7%;width:44%;height:30%;border-radius:50%;
  background:linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,0) 72%);
  filter:blur(1.5px);pointer-events:none;}

/* 中心那顆(這週新加入)才有的掃光 */
.bub.newest::after{content:'';position:absolute;top:-20%;bottom:-20%;left:0;width:42%;
  background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 45%, rgba(255,255,255,.62) 50%, rgba(255,255,255,.34) 55%, rgba(255,255,255,0) 100%);
  transform:translateX(-160%) skewX(-12deg);animation:bubShine 12s ease-in-out infinite 1.8s;pointer-events:none;}
@keyframes bubShine{0%{transform:translateX(-160%) skewX(-12deg)}38%{transform:translateX(320%) skewX(-12deg)}100%{transform:translateX(320%) skewX(-12deg)}}

.bub-logo{display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:26%;
  background:#fff;box-shadow:0 1px 3px rgba(60,45,20,.14);flex:none;}
.bub-logo img{width:100%;height:100%;object-fit:contain;padding:14%;display:block;}
.bub-logo .mono{font-weight:800;color:#9a968d;line-height:1;}
.bub-tkr{font-weight:700;letter-spacing:-.2px;line-height:1;color:#4b463d;white-space:nowrap;}
.bub-score{font-weight:800;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;}

/* ── 「?」說明泡泡 ── */
.helpb{position:absolute;z-index:5;right:20px;bottom:22px;width:56px;height:56px;border-radius:50%;
  border:1px solid rgba(255,255,255,.85);cursor:pointer;font-family:inherit;
  background:radial-gradient(78% 62% at 30% 22%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.42) 46%, rgba(255,255,255,.10) 74%), rgba(255,255,255,.30);
  backdrop-filter:blur(7px) saturate(135%);-webkit-backdrop-filter:blur(7px) saturate(135%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.95), inset 0 -10px 22px rgba(150,128,96,.14), 0 10px 26px rgba(74,56,26,.10);
  font-size:21px;font-weight:700;color:#6a6459;
  opacity:0;transform:scale(.86);transition:opacity .5s ease 1.5s, transform .6s cubic-bezier(.22,.9,.28,1) 1.5s;}
.stage.risen .helpb{opacity:1;transform:scale(1);}
.helpcard{position:absolute;z-index:6;right:20px;bottom:22px;width:min(320px, calc(100vw - 40px));
  background:rgba(255,255,255,.86);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:22px 22px 18px;
  box-shadow:0 18px 44px rgba(74,56,26,.16);
  opacity:0;visibility:hidden;transform:translateY(10px) scale(.94);transform-origin:100% 100%;
  transition:opacity .28s ease, transform .34s cubic-bezier(.22,.9,.28,1), visibility .34s;}
.helpcard.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
.helpcard li{list-style:none;font-size:13.5px;line-height:1.72;color:#4b463d;padding-left:15px;position:relative;margin-bottom:12px;text-wrap:pretty;}
.helpcard li:last-child{margin-bottom:0;}
.helpcard li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.55;}
.helpcard .close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:19px;color:var(--ink3);cursor:pointer;font-family:inherit;line-height:1;padding:4px;}

/* ── 頁尾佔位 ── */
.fakefoot{background:#f5f5f7;border-top:1px solid var(--line2);padding:34px 22px 60px;text-align:center;}
.fakefoot p{font-size:11px;color:#9a9a9f;line-height:1.7;max-width:420px;margin:0 auto;}

/* ── 預覽專用控制列(正式版不會有)── */
.pvbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:200;
  display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;
  background:rgba(28,26,23,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.26);}
.pvbar button{border:none;background:transparent;color:rgba(255,255,255,.62);font-family:inherit;
  font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;}
.pvbar button.on{background:rgba(255,255,255,.16);color:#fff;}
.pvbar .sep{width:1px;height:16px;background:rgba(255,255,255,.18);}

@media(min-width:960px){
  :root{--navh:64px;}
  .hero h1{font-size:60px;letter-spacing:-2px;}
  .hero p{font-size:18px;max-width:560px;}
  .helpb{width:64px;height:64px;font-size:24px;right:40px;bottom:40px;}
  .helpcard{right:40px;bottom:40px;width:380px;}
  .helpcard li{font-size:14.5px;}
}
@media (prefers-reduced-motion: reduce){
  .bub.newest::after{display:none;}
  .startb::after{display:none;}
}
</style>
</head>
<body>

<div class="fakenav">
  <div class="brand">DCA<i>café</i><span class="ver">preview 6</span></div>
  <div class="burger"><span></span><span></span><span></span></div>
</div>

<div class="stage" id="stage">
  <div class="hero" id="hero">
    <h1 id="hTitle">每週一支，話題資產</h1>
    <p id="hSub">我們每週挑出一支正在被討論的資產，用 DCA Score 幫你看它現在的位置。分數越極端，泡泡越大。</p>
    <button class="startb" id="startBtn">看這週的泡泡</button>
  </div>

  <div class="field" id="field"></div>

  <button class="helpb" id="helpBtn" aria-label="說明">?</button>
  <div class="helpcard" id="helpCard">
    <button class="close" id="helpClose" aria-label="關閉">×</button>
    <ul id="helpList"></ul>
  </div>
</div>

<div class="fakefoot">
  <p id="footNote">頁尾位置（正式版由 chrome.js 注入）</p>
</div>

<div class="pvbar">
  <button data-n="3">3</button>
  <button data-n="8">8</button>
  <button data-n="14" class="on">14</button>
  <div class="sep"></div>
  <button data-lang="zh" class="on">中</button>
  <button data-lang="en">EN</button>
  <div class="sep"></div>
  <button id="force">動態</button>
  <button id="replay">↻</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   人氣熱搜 泡泡頁 · 預覽檔
   規則:
     · 泡泡大小 = 分數離 50 分的距離(高分低分都值得看,中間最小),先分級
     · 泡泡本身透明,不帶顏色;顏色資訊由分數數字承擔(沿用站上既有色階)
     · 內容依「實際直徑」降級:大→Logo+代號+分數 / 中→代號+分數 / 小→只剩Logo
     · 位置:最新的在正中間,越舊越往外(依序往外找空位)
     · 場地剛好一個視窗高,泡泡永遠不會超出畫面
   ══════════════════════════════════════════════════════════════ */

/* 假資料:排序 = 新舊(第一筆最新,放正中間) */
var DATA=[
 {t:'NFLX',d:'netflix.com',s:84},
 {t:'COIN',d:'coinbase.com',s:91},
 {t:'TSLA',d:'tesla.com',s:23},
 {t:'NVDA',d:'nvidia.com',s:72},
 {t:'AAPL',d:'apple.com',s:62},
 {t:'SMCI',d:'supermicro.com',s:26},
 {t:'AMD',d:'amd.com',s:76},
 {t:'PLTR',d:'palantir.com',s:68},
 {t:'AMZN',d:'amazon.com',s:33},
 {t:'MSFT',d:'microsoft.com',s:47},
 {t:'GOOG',d:'google.com',s:55},
 {t:'META',d:'meta.com',s:51},
 {t:'SPY', d:'',            s:44},
 {t:'IBM', d:'ibm.com',s:49}
];

/* 站上既有的分數色階(取自資產頁 scoreCol) */
function scoreCol(s){ return s<60?'#a5a299': s<70?'#d9b47e': s<80?'#d69f5c': s<90?'#c8813a':'#b06a1e'; }

/* 大小分級:d = |分數 − 50| */
function baseSize(s){ var d=Math.abs(s-50); return d>=30?150 : d>=20?118 : d>=10?90 : 58; }

var T={
 zh:{title:'每週一支，話題資產',
     sub:'我們每週挑出一支正在被討論的資產，用 DCA Score 幫你看它現在的位置。分數越極端，泡泡越大。',
     help:['泡泡大小看的是分數離中間有多遠，不是漲跌。高分和低分一樣醒目——高分代表現在值得多投一點，低分代表照常就好。',
           '正中間那顆是這週新加入的。',
           '點任何一顆，看那支資產的完整分析。'],
     foot:'頁尾位置（正式版由 chrome.js 注入）',
     start:'看這週的<br>泡泡'},
 en:{title:'One asset a week, worth talking about.',
     sub:'Every week we pick one asset people are talking about, and read it through the DCA Score. The further from the middle, the bigger the bubble.',
     help:['Size shows how far the score sits from the middle, not price movement. High and low both stand out — a high score means this one can take more, a low score means keep it steady.',
           "The one in the center is this week's addition.",
           'Tap any bubble for the full breakdown.'],
     foot:'Footer goes here (injected by chrome.js in production)',
     start:"See this<br>week's bubbles"}
};

var LANG='zh', N=14, FORCE=false;

/* ── 排版:最新的放中心,其餘依序往外找第一個放得下的空位 ── */
function pack(items, W, H){
  var pad=8, gap=7, i, r, a, tries;
  for(tries=0; tries<8; tries++){
    var sum=0;
    for(i=0;i<items.length;i++){ var b=items[i].base; sum+=Math.PI*b*b/4; }
    var k=Math.sqrt((0.44*W*H)/sum);
    k=Math.max(0.62, Math.min(2.3, k)) * Math.pow(0.9, tries);
    var maxD=Math.min(W,H)*0.44;
    for(i=0;i<items.length;i++) items[i].d=Math.min(items[i].base*k, maxD);

    var placed=[], cx=W/2, cy=H/2, ok=true;
    for(i=0;i<items.length;i++){
      var it=items[i], rad=it.d/2, found=null;
      var maxR=Math.sqrt(W*W+H*H)/2;
      for(r=0; r<=maxR && !found; r+=4){
        var steps = r<1 ? 1 : Math.max(10, Math.round(2*Math.PI*r/7));
        var off = i*2.399963;
        for(var q=0;q<steps;q++){
          a = off + q*2*Math.PI/steps;
          var x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
          if(x-rad<pad || x+rad>W-pad || y-rad<pad || y+rad>H-pad) continue;
          var clash=false;
          for(var j=0;j<placed.length;j++){
            var p=placed[j], dx=x-p.x, dy=y-p.y;
            if(Math.sqrt(dx*dx+dy*dy) < rad+p.d/2+gap){ clash=true; break; }
          }
          if(!clash){ found={x:x,y:y}; break; }
        }
      }
      if(!found){ ok=false; break; }
      it.x=found.x; it.y=found.y; placed.push({x:found.x,y:found.y,d:it.d});
    }
    if(ok) return items;
  }
  return items;
}

function render(){
  var stage=document.getElementById('stage'), field=document.getElementById('field');
  var W=field.clientWidth, H=field.clientHeight;
  var items=DATA.slice(0,N).map(function(a){ return {t:a.t, dom:a.d, s:a.s, base:baseSize(a.s)}; });
  pack(items, W, H);

  stage.classList.remove('risen');
  field.classList.remove('go');
  field.innerHTML='';

  items.forEach(function(it, i){
    var d=it.d;
    var el=document.createElement('a');
    el.className='bub'+(i===0?' newest':'');
    el.href='/asset/'+it.t.toLowerCase()+'.html';
    el.style.left=(it.x-d/2)+'px';
    el.style.top =(it.y-d/2)+'px';
    el.style.width=d+'px'; el.style.height=d+'px';
    el._rise = H - it.y + d;
    el._y = it.y;

    /* 內容依實際直徑降級 */
    var showAll = d>=112, showText = d>=76;
    var html='';
    if(showAll || !showText){
      var ls = showAll ? Math.round(d*0.26) : Math.round(d*0.52);
      var inner = it.dom
        ? '<img src="https://cdn.tickerlogos.com/'+it.dom+'" alt="'+it.t+'" onerror="this.parentElement.innerHTML=\'<span class=&quot;mono&quot; style=&quot;font-size:'+Math.round(ls*0.5)+'px&quot;>'+it.t.charAt(0)+'</span>\'">'
        : '<span class="mono" style="font-size:'+Math.round(ls*0.5)+'px">'+it.t.charAt(0)+'</span>';
      html+='<span class="bub-logo" style="width:'+ls+'px;height:'+ls+'px;margin-bottom:'+(showAll?Math.round(d*0.05):0)+'px">'+inner+'</span>';
    }
    if(showText){
      html+='<span class="bub-tkr" style="font-size:'+Math.round(d*0.135)+'px">'+it.t+'</span>';
      html+='<span class="bub-score" style="font-size:'+Math.round(d*0.25)+'px;color:'+scoreCol(it.s)+'">'+it.s+'</span>';
    }
    el.innerHTML=html;
    field.appendChild(el);
  });

  /* 泡泡此刻已經全部在 HTML 裡(搜尋引擎讀得到),只是還沉在畫面下方。
     真正浮起的時機由使用者按下啟動泡泡決定。 */
}

/* ── 啟動:泡泡浮上來,Hero 沉下去 ──
   動畫改用 JS 直接驅動(不靠 CSS transition)。原因:transition 依賴瀏覽器
   在兩個狀態之間補間,iOS Safari 在某些情況會直接跳到終點,看起來就是
   「泡泡瞬間全部出現」。JS 動畫是明確指定的一段過程,不會被略過。 */
function start(){
  var stage=document.getElementById('stage'), field=document.getElementById('field');
  if(stage.classList.contains('risen')) return;
  var reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) && !FORCE;
  stage.classList.add('risen');
  field.classList.add('go');

  /* 由下往上一排一排浮:依「最終位置的高低」決定出場順序,
     最底下的先浮,最上面的最後,整片才會像水位往上淹過標題。
     (不是依資料順序——那樣會從中間開始冒,看起來是散的) */
  var els = [].slice.call(field.children);
  var order = els.slice().sort(function(a,b){ return b._y - a._y; });

  els.forEach(function(el){
    var rank = order.indexOf(el);
    if(!el.animate) return;
    if(reduce){
      el.animate([{opacity:0},{opacity:1}],
        {duration:900, delay:rank*45, easing:'ease', fill:'both'});
      return;
    }
    el.animate([
      { transform:'translateY('+el._rise+'px) scale(.94)', opacity:0, offset:0 },
      { opacity:1, offset:0.10 },
      { transform:'translateY(0px) scale(1)', opacity:1, offset:1 }
    ], {
      duration: 2100,
      delay: 80 + rank*95,
      easing: 'cubic-bezier(.30,.62,.28,1)',
      fill: 'both'
    });
  });
}

function applyLang(){
  var t=T[LANG];
  document.getElementById('hTitle').textContent=t.title;
  document.getElementById('hSub').textContent=t.sub;
  document.getElementById('footNote').textContent=t.foot;
  document.getElementById('helpList').innerHTML=t.help.map(function(x){return '<li>'+x+'</li>';}).join('');
  document.getElementById('startBtn').innerHTML=t.start;
  document.documentElement.lang = LANG==='zh' ? 'zh-Hant' : 'en';
}

/* ── 「?」說明 ── */
var card=document.getElementById('helpCard');
document.getElementById('helpBtn').addEventListener('click', function(e){ e.stopPropagation(); card.classList.toggle('open'); });
document.getElementById('helpClose').addEventListener('click', function(){ card.classList.remove('open'); });
document.addEventListener('click', function(e){ if(!card.contains(e.target)) card.classList.remove('open'); });

/* ── 預覽控制列 ── */
document.querySelectorAll('.pvbar button[data-n]').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.pvbar button[data-n]').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); N=+b.dataset.n; render();
  });
});
document.querySelectorAll('.pvbar button[data-lang]').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.pvbar button[data-lang]').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); LANG=b.dataset.lang; applyLang();
  });
});
document.getElementById('force').addEventListener('click', function(){
  FORCE=!FORCE; this.classList.toggle('on', FORCE); render();
});
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('replay').addEventListener('click', render);

var rt;
window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(render, 200); });

applyLang();
render();
</script>
</body>
</html>
