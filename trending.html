<script>
(function(){
  try{
    var s = location.search || '';
    if(/[?&]desktop=0(\b|$)/.test(s)){ localStorage.removeItem('forceDesktop'); }
    else if(/[?&]desktop=1(\b|$)/.test(s)){ localStorage.setItem('forceDesktop','1'); }
    if(localStorage.getItem('forceDesktop')==='1'){
      var vp = document.querySelector('meta[name="viewport"]');
      if(vp){ vp.setAttribute('content','width=1200'); }
      document.documentElement.setAttribute('data-preview-desktop','1');
    }
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#faf9f6; --ink:#1d1d1f; --ink2:#6e6a62; --ink3:#a5a29a;
  --line:#ececE6; --line2:#f2f0ea; --accent:#c8813a;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang TC','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;}
body{overflow-x:hidden;}
#siteHeader{display:contents;}

/* ═══════════════════════════════════════════════════════════
   泡泡場:整頁剛好一個視窗高,泡泡永遠不超出畫面。
   啟動前泡泡就已經在 HTML 裡(給搜尋引擎),只是沉在畫面下緣。
   ═══════════════════════════════════════════════════════════ */
:root{--navh:0px; --hdrh:0px;}
body{padding-top:var(--navh);}   /* 桌機頁首是 position:fixed,要讓出等高上緣 */
/* --navh 只給 body 的上緣補償用(僅 fixed 時才有值)。
   --hdrh 是頁首實際佔掉的高度,不管它是 fixed 還是一般排版流都有值,
   舞台一律要扣掉它 —— 否則手機上(頁首在排版流裡、--navh 為 0)舞台會從
   頁首下方開始卻仍然要求整整一個視窗高,整頁就比可見範圍多出一個頁首的
   高度,最下面那顆泡泡會被推到畫面外,中間還會多出一條填不滿的空帶。 */
.stage{
  position:relative;
  /* --stageh 由 syncNav() 量出來(visualViewport 回報的實際可見高度減去舞台上緣
     的位置),min/max 同時指向它等於把高度釘死。100svh 那一段只是 JS 還沒跑完
     之前的後備 —— 不要把它當成主要依據:在無痕加底部工具列的 Safari 上,
     100svh 算出來比實際可見範圍大,舞台底部會被壓在工具列下面,最下面那顆
     泡泡就被切掉。CSS 單位在這裡不可靠,所以改成直接量。 */
  min-height:var(--stageh, calc(100svh - var(--hdrh)));
  max-height:var(--stageh, none);
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:0 20px;
}

/* ── Hero:標題與啟動鈕。按下後淡出,讓泡泡蓋上來 ── */
.hero{
  position:relative;z-index:3;
  text-align:center;max-width:640px;margin:0 auto;
  padding:clamp(48px,10svh,96px) 0 0;
  transition:opacity .5s ease, transform .5s ease;
}
.hero.gone{opacity:0;transform:translateY(-14px);pointer-events:none;}
/* ══ 與站上其他 Hero(.page-hero)完全一致 ══
   手機:眉毛 10 橘色 / 標題 30 字重 650 / 內文 14
   桌機:眉毛 13 / 標題 76 / 內文 19
   數值取自 main.css .page-hero 與 web.css 的桌機覆蓋,不要在這裡自創一套。 */
.hero .eyebrow{font-size:10px;font-weight:600;letter-spacing:2.8px;color:var(--accent);
  text-transform:uppercase;margin-bottom:10px;}
.hero h1{font-size:30px;font-weight:650;letter-spacing:-.6px;line-height:1.18;color:var(--ink);}
/* 後半段染橘,與站上 .page-hero h2 em 同一套。
   white-space:nowrap 是為了讓橘色那段永遠整段一起換行,不會被拆成兩行。 */
.hero h1 em{font-style:normal;color:var(--accent);white-space:nowrap;}
.hero h1 .a{white-space:nowrap;}
.hero p{font-size:14px;line-height:1.6;color:var(--ink2);margin:10px auto 0;max-width:360px;}
/* 手動斷點:桌機一句一行;手機寬度不同,硬斷會很怪,所以自然接續 */
.hero .ln{display:inline;}

/* 啟動泡泡:玻璃感,與泡泡場同一種材質 */
.launch{
  position:relative;z-index:3;margin-top:clamp(26px,5svh,44px);
  border:none;cursor:pointer;font-family:inherit;
  font-size:clamp(14px,2.2vw,16px);font-weight:700;color:var(--ink);
  padding:16px 30px;border-radius:999px;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 8px 26px rgba(20,20,15,.10), inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  overflow:hidden;
}
.launch::after{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  animation:sweepBtn 5.5s ease-in-out infinite;
}
@keyframes sweepBtn{0%{left:-60%}55%{left:120%}100%{left:120%}}
.launch.gone{opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .4s ease,transform .4s ease;}

/* ── 泡泡 ── */
.field{position:absolute;inset:0;z-index:2;pointer-events:none;}
.field.live{pointer-events:auto;}
.bub{
  position:absolute;border-radius:50%;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 32% 26%,
      rgba(255,255,255,.92) 0%, rgba(255,255,255,.42) 38%, rgba(255,255,255,.16) 70%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 10px 30px rgba(20,20,15,.10),
             inset 0 2px 6px rgba(255,255,255,.95),
             inset 0 -8px 18px rgba(160,150,130,.10);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;                       /* 進場動畫由 JS 接手 */
  will-change:transform,opacity;
}
.bub .lg{width:34%;height:34%;border-radius:50%;overflow:hidden;background:#fff;
  display:flex;align-items:center;justify-content:center;margin-bottom:6%;
  box-shadow:0 1px 4px rgba(0,0,0,.10);}
.bub .lg img{width:100%;height:100%;object-fit:cover;display:block;padding:0;}
.bub .tk{font-weight:800;letter-spacing:-.4px;line-height:1;}
.bub .sc{font-weight:800;letter-spacing:-1px;line-height:1;margin-top:5%;
  font-variant-numeric:tabular-nums;}
/* ── 依實際直徑降級,四段 ────────────────────────────────────────────
     (無 class)  Logo + 代號 + 分數,Logo 34%
     .md         同上,Logo 縮到 26% 讓出空間
     .xs         去掉代號,留 Logo + 分數。分數才是這個頁面的重點,
                 而且代號在 Logo 上通常看得出來,先捨代號是划算的取捨
     .sm         只剩 Logo。字再小就是糊的,不如不要

   門檻是量出來的,不是猜的。在 375×648 的手機上,各資產數量下最小的那顆:
     5 支 120px / 8 支 95px / 12 支 73px / 15 支 65px / 20 支 55px / 30 支 44px
   所以 12 支以前不會碰到任何降級,20 支才會出現 .xs,25 支以上才有 .sm。

   曾經踩過的坑:中級原本是 .lg{display:none},空間不夠時直接把 Logo 藏掉。
   但直徑會隨視窗與資產數量浮動,落在那一段就整排沒有 Logo,看起來像壞掉
   而不是刻意降級。所以現在四段裡 Logo 一律保留,要捨先捨文字。 ── */
.bub.md .lg{width:26%;height:26%;margin-bottom:5%;}
.bub.xs .tk{display:none;}
.bub.xs .lg{width:30%;height:30%;margin-bottom:6%;}
.bub.xs .sc{margin-top:0;}
.bub.sm .tk,.bub.sm .sc{display:none;}
.bub.sm .lg{width:56%;height:56%;margin:0;}

/* 最大的那幾顆:週期掃光(沿用站上 Duel 按鈕那套,放慢)。
   沒有這一道的話,大泡泡只是「比較大的白圓」,沒有玻璃質感,也看不出它是焦點。
   哪幾顆由 applySizes() 依直徑比例決定,不是固定幾名。 */
.bub.shine::after{
  content:'';position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  background-size:260% 100%;background-position:140% 0;
  animation:sweepBub 7s ease-in-out infinite;pointer-events:none;
}
@keyframes sweepBub{0%{background-position:140% 0}60%{background-position:-140% 0}100%{background-position:-140% 0}}

/* 說明泡泡:點開就地放大成小卡 */
.helpb{
  /* 固定在視窗右下角:泡泡場比一個螢幕高的時候,不該還要捲動才找得到說明 */
  position:fixed;right:18px;bottom:18px;z-index:40;width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(255,255,255,.9);cursor:pointer;font-family:inherit;
  font-size:20px;font-weight:800;color:var(--ink2);
  background:radial-gradient(120% 120% at 32% 26%,
      rgba(255,255,255,.92) 0%, rgba(255,255,255,.45) 40%, rgba(255,255,255,.18) 72%);
  box-shadow:0 8px 22px rgba(20,20,15,.10), inset 0 2px 6px rgba(255,255,255,.95);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;
  transition:width .34s cubic-bezier(.22,1,.36,1),height .34s cubic-bezier(.22,1,.36,1),
             border-radius .34s cubic-bezier(.22,1,.36,1),padding .34s ease;
}
.helpb.show{display:flex;}
.helpb .qm{display:block;}
.helpb .body{display:none;text-align:left;}
.helpb.open{
  width:min(320px,calc(100vw - 44px));height:auto;border-radius:24px;
  padding:22px 22px 20px;align-items:flex-start;
}
.helpb.open .qm{display:none;}
.helpb.open .body{display:block;}
.helpb .body h3{font-size:15px;font-weight:800;margin-bottom:10px;color:#1d1d1f;}
/* 卡片底是半透明玻璃,文字要比一般內文更深才讀得清楚 */
.helpb .body p{font-size:13.5px;line-height:1.65;color:#3a3733;margin-bottom:8px;}
.helpb .body p:last-child{margin-bottom:0;}

/* 沒有資料時的說明 */
.empty{position:absolute;z-index:3;left:50%;top:56%;transform:translate(-50%,-50%);
  text-align:center;color:var(--ink3);font-size:14px;display:none;}

@media(min-width:960px){
  /* 與頁尾之間的留白,比照站上其他區塊的 100px。
     刻意用 margin 不用 padding:.field 是 inset:0 的絕對定位層,
     padding 會被它覆蓋,泡泡會浮進本來要留白的地方。 */
  .stage{padding:0 40px;margin-bottom:100px;}
  .hero{padding-top:clamp(56px,9svh,110px);}
  .hero .eyebrow{font-size:13px;letter-spacing:3px;margin-bottom:22px;}
  .hero h1{font-size:76px;line-height:1.08;letter-spacing:-2.4px;}
  .hero p{font-size:19px;line-height:1.7;max-width:900px;margin-top:26px;}
  .hero .ln{display:block;}
  .launch{font-size:16px;padding:17px 34px;}
  .helpb{width:58px;height:58px;font-size:22px;}
  .helpb.open{width:380px;padding:26px;}
  .helpb .body h3{font-size:17px;}
  .helpb .body p{font-size:14.5px;}
}
</style>
</head>
<body>

<div id="siteHeader"></div>

<section class="stage" id="stage">
  <div class="hero" id="hero">
    <div class="eyebrow" id="t-eyebrow">Trending</div>
    <h1 id="t-h1"><span class="a">Trending Is Just</span> <em>the Beginning.</em></h1>
    <p id="t-sub"><span class="ln">It Was Trending. What About Now? A running collection of assets once in the spotlight.</span> <span class="ln">See their DCA Scores, and the answer is right in front of you.</span></p>
  </div>
  <button class="launch" id="launch">See Them Now</button>

  <!-- 泡泡在啟動前就已經在 HTML 裡(搜尋引擎讀得到),只是沉在畫面下緣 -->
  <div class="field" id="field"></div>

  <button class="helpb" id="helpb" aria-label="How this works">
    <span class="qm">?</span>
    <span class="body" id="helpBody"></span>
  </button>

  <div class="empty" id="empty"></div>
</section>

<div id="siteFooter"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   人氣熱搜(Trending)泡泡頁
   · 資產清單來自 assets.js(單一來源),最上面那支 = 最新 → 放正中心
   · 分數即時打 ticker-score,失敗的那支不畫泡泡
   · 泡泡大小 = 偏離 50 分的程度,分四級(界線 60/70/80,低分對稱 40/30/20)
     高分低分同樣距離就同樣大;中間最小。
   ══════════════════════════════════════════════════════════════ */
(function(){
  var PROXY = 'https://proxy-three-mu-47.vercel.app/api';
  var LANGKEY = 'dcacafe_lang';
  /* 語言由網址鎖定(head 的 DCA_LANG)，不再讀 localStorage */
  function lang(){ return (window.DCA_LANG === 'zh') ? 'zh' : 'en'; }

  var T = {
    zh:{
      eyebrow:'人氣熱搜',
      h1:['熱門，','只是開始。'],
      /* 兩句各自一行:桌機照這個斷點,手機自然接續(見 .ln 的樣式) */
      sub:['曾經熱門，現在呢？每週熱搜資產，持續追蹤。','看看它們的 DCA Score，答案就在眼前。'],
      launch:'看看現在',
      help:['泡泡怎麼看',
            '每一顆泡泡是一支資產，點下去看它的完整分析。',
            '泡泡越大，代表它的 DCA Score 離中間越遠——不管是偏高還是偏低，都是值得看一眼的位置。中間的分數最平常，泡泡也最小。',
            '數字的顏色跟著加碼倍數走：60 分以下維持原本金額，顏色最淡；60 分以上開始有加碼空間，分數越高顏色越深。',
            '泡泡會互相推擠,最後停在擠得下的位置,所以每次打開排列都不一樣。'],
      empty:'資產資料載入中，稍候再試一次。'
    },
    en:{
      eyebrow:'Trending',
      h1:['Trending Is Just','the Beginning.'],
      sub:['It Was Trending. What About Now? A running collection of assets once in the spotlight.',
           'See their DCA Scores, and the answer is right in front of you.'],
      launch:'See Them Now',
      help:['How to read the bubbles',
            'Each bubble is one asset. Tap it for the full read.',
            'The bigger the bubble, the further that asset sits from the middle of the DCA Score — high or low, both are worth a look. Scores near the middle are the most ordinary, so their bubbles are the smallest.',
            'The colour of the number follows the add-on multiple: below 60 the amount stays as usual and the colour is at its lightest; from 60 up there is room to add more, and the colour deepens as the score climbs.',
            'The bubbles push against one another and settle wherever they fit, so the arrangement is different every time.'],
      empty:'Asset data is still loading. Please try again shortly.'
    }
  };

  function setText(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; }
  function applyLang(){
    var t = T[lang()];
    setText('t-eyebrow', t.eyebrow);
    var h1 = document.getElementById('t-h1');
    if(h1) h1.innerHTML = '<span class="a">' + t.h1[0] + '</span> <em>' + t.h1[1] + '</em>';
    var sub = document.getElementById('t-sub');
    if(sub) sub.innerHTML = t.sub.map(function(l){ return '<span class="ln">' + l + '</span>'; }).join(' ');
    var b = document.getElementById('launch'); if(b) b.textContent = t.launch;
    var hb = document.getElementById('helpBody');
    if(hb) hb.innerHTML = '<h3>' + t.help[0] + '</h3>'
      + t.help.slice(1).map(function(p){ return '<p>' + p + '</p>'; }).join('');
    setText('empty', t.empty);
    document.documentElement.lang = (lang() === 'zh') ? 'zh-Hant' : 'en';
  }
  window.applyPageLang = applyLang;   /* chrome.js 切語言時會呼叫 */

  /* ── 尺寸分級:偏離 50 分的距離 → 四級 ── */
  function tier(score){
    var d = Math.abs(score - 50);
    if(d < 10) return 0;      /* 40–60   最小 */
    if(d < 20) return 1;      /* 30–40 / 60–70 */
    if(d < 30) return 2;      /* 20–30 / 70–80 */
    return 3;                 /* 20 以下 / 80 以上  最大 */
  }
  /* 色階的意義與站上其他頁完全一致(分數越高越暖、60 以下一律中性),
     只是整組加深:泡泡是半透明玻璃,原本的淺灰淺褐在上面糊成一片。 */
  var scoreCol = function(s){
    return s < 60 ? '#7d7970' : s < 70 ? '#bf9350' : s < 80 ? '#b57d33'
         : s < 90 ? '#a2661f' : '#8a5214';
  };

  var field = document.getElementById('field');
  var stage = document.getElementById('stage');
  var hero  = document.getElementById('hero');
  var launch= document.getElementById('launch');
  var helpb = document.getElementById('helpb');
  var items = [];      /* {el, d} */
  var started = false;

  /* ══════════════════════════════════════════════════════════════════════
     泡泡場 — 物理模擬

     舊版是「一次算好位置再擺上去」:繞圈找空位、撐開、長大。那套的極限是它
     算完就結束,畫面是靜止的擺設。現在改成真的跑物理 —— 泡泡有速度、互相推擠、
     撞到會彈開,最後自己停下來,維持微微抖動。

     三個階段:
       rise    由下往上浮,一組一組出發,互相推擠
       settle  動能耗盡後切換,浮力幾乎歸零,改成偶爾給一個很小的隨機推力
       (暫停)  分頁切走時停掉 rAF,回來再接上

     幾件事是量出來、踩過坑才定的,改之前先讀註解:
       · FILL 是「泡泡本身」佔舞台的比例,不含間距。加上 GAP 之後實際要佔的是
         π(r + GAP/2)²,容易低估。圓形隨機堆疊的實際極限大約八成,超過了就永遠
         擠不下,物理會每一幀都在推開,看起來就是一直在抖。
       · 位置修正要設上限。不設的話重疊會被一次推開 —— 那是瞬間位移,不走速度,
         看起來就是泡泡在彈。
       · 出發點要集中在中間一帶。散開的話每顆各走各的垂直車道,一路到頂都碰不到
         人,就沒有碰撞感。
       · 出發順序要隨機。按大小排(不管哪個方向)都會在最後的位置上留下痕跡 ——
         先出發的先占住上面,後到的只能堆在下面。
       · 浮力不跟大小走。大泡泡浮得快雖然物理上對,但會把分數排出來:極端的永遠
         在上面。
     ══════════════════════════════════════════════════════════════════════ */

  var FILL = 0.54;          /* 泡泡本身佔舞台的比例(不含間距) */
  var GAP = 10;             /* 兩顆之間至少留的距離 */
  var MAXPX = 260, MINPX = 40;
  var MAXFIX = 0.85;        /* 位置修正每幀的上限 */

  var parts = [];           /* 物理狀態,跟 items 一一對應 */
  var mode = 'rise';
  var calmFrames = 0;
  var riseFrames = 0;       /* rise 跑了幾幀,用來兜底切 settle */
  var rafId = 0;
  var SW = 0, SH = 0;       /* 上一次算的舞台尺寸 */

  /* ── 直徑:絕對偏離 + 批內排名,各佔一半 ──────────────────────────────
     只看「離 50 多遠」的話,分數集中在 40~70 時所有泡泡都擠成差不多大,畫面會
     排成整齊的列。摻進排名之後,不管分數多集中,同一批裡的尺寸一定拉得開。
     權重是面積,所以要平方 —— 直徑比落在 0.42~1.0,約 2.4 倍。 ── */
  function sizesFor(list, W, H){
    var devs = list.map(function(it){ return it.dev; });
    var dmax = Math.max.apply(null, devs) || 1;
    var rank = devs.map(function(_, i){ return i; })
                   .sort(function(x, y){ return devs[x] - devs[y]; });
    var rpos = new Array(list.length);
    rank.forEach(function(idx, r){
      rpos[idx] = list.length > 1 ? r / (list.length - 1) : 1;
    });
    var wt = list.map(function(_, i){
      var u = 0.45 * (devs[i] / dmax) + 0.55 * rpos[i];
      return Math.pow(0.42 + 0.58 * u, 2);
    });
    var ws = wt.reduce(function(x, y){ return x + y; }, 0) || 1;
    /* 上限除了 MAXPX,還要受舞台短邊限制。只看面積的話,橫向螢幕(例如 844x330)
       會算出比舞台還高的泡泡,堆兩層就被擠出去。 */
    var cap = Math.min(MAXPX, Math.max(MINPX, Math.min(W, H) * 0.42));
    var SZ = wt.map(function(w){
      var d = 2 * Math.sqrt(W * H * FILL * w / ws / Math.PI);
      return Math.max(MINPX, Math.min(d, cap));
    });

    /* ── 放不下就整組縮小 ───────────────────────────────────────────────
       FILL 只算泡泡本身,但每顆實際要佔的是 π(r + GAP/2)² —— 間距那一圈也要
       地方。資產一多、或螢幕一小,實際要佔的面積會遠超過 FILL,物理就擠不下:
       泡泡被一直推、推到出界或疊在一起。舊的排位版有「放不下就縮小重試」,
       物理版沒有那道保險,所以在這裡先把尺寸壓到裝得下為止。

       0.68 是圓形隨機堆疊能穩定收斂的上限附近。MINPX 是地板,撞到地板時
       寧可留一點重疊也不要小到看不見 —— 那種情況只會發生在很小的螢幕塞
       幾十支,實務上碰不到。 ── */
    var MAXCOVER = 0.68;
    var eff = SZ.reduce(function(a, d){
      var rr = d / 2 + GAP / 2;
      return a + Math.PI * rr * rr;
    }, 0) / (W * H);
    if(eff > MAXCOVER){
      var k = Math.sqrt(MAXCOVER / eff);
      SZ = SZ.map(function(d){ return Math.max(MINPX, d * k); });
    }
    return SZ.map(function(d){ return Math.round(d); });
  }

  /* 右下角的說明按鈕是 position:fixed,物理完全不知道它存在。泡泡少的時候碰不到,
     填滿舞台之後就會被壓在底下。把它的範圍當成禁區。 */
  function helpBox(W, H){
    var s = (window.matchMedia && window.matchMedia('(min-width:960px)').matches) ? 58 : 52;
    return { x0: W - 18 - s - 10, x1: W - 18 + 10,
             y0: H - 18 - s - 10, y1: H - 18 + 10 };
  }
  function clearsHelp(hb, x, y, r){
    var nx = Math.max(hb.x0, Math.min(x, hb.x1));
    var ny = Math.max(hb.y0, Math.min(y, hb.y1));
    var dx = x - nx, dy = y - ny;
    return dx * dx + dy * dy >= r * r;
  }

  /* ── 套尺寸 + 內容降級 ── */
  function applySizes(list, SZ){
    var maxD = Math.max.apply(null, SZ);
    list.forEach(function(it, i){
      var d = SZ[i], el = it.el;
      el.style.width = el.style.height = d + 'px';
      el.style.fontSize = Math.round(d * 0.13) + 'px';
      var tk = el.querySelector('.tk'), sc = el.querySelector('.sc');
      if(tk) tk.style.fontSize = Math.round(d * 0.155) + 'px';
      if(sc) sc.style.fontSize = Math.round(d * 0.26) + 'px';
      /* 四段降級:要捨先捨文字,logo 一律保留。直徑會隨視窗與資產數量浮動,
         藏掉 logo 的話會變成「有些有圖、有些沒有」,看起來像壞掉。 */
      el.classList.remove('sm', 'xs', 'md', 'shine');
      if(d < 56) el.classList.add('sm');
      else if(d < 72) el.classList.add('xs');
      else if(d < 96) el.classList.add('md');
      /* 最大的那幾顆加一道掃光。用比例而不是固定幾名,尺寸接近的會一起亮。 */
      if(d >= maxD * 0.86) el.classList.add('shine');
      el.style.opacity = 1;
    });
  }

  /* ── 準備:算尺寸、擺到畫面外、排出發時間 ── */
  function prepare(list){
    var W = stage.clientWidth, H = stage.clientHeight;
    if(!W || !H || !list.length) return;
    SW = W; SH = H;
    var SZ = sizesFor(list, W, H);
    applySizes(list, SZ);

    parts = list.map(function(it, i){
      var r = SZ[i] / 2;
      return {
        it: it, r: r, m: r * r,          /* 質量用面積,大的不會被小的推飛 */
        /* 位置在「出發當下」才決定(見 frame() 的 spawn)。在這裡先給的話,還沒
           出發的幾十顆會全部疊在同一塊區域,延遲一到就突然開始碰撞,而位置修正
           每幀只有 MAXFIX,深度重疊要幾十幀才解得開 —— 資產一多就會看到一團。 */
        x: W / 2, y: H + r + 40,
        spawned: false,
        vx: (Math.random() - 0.5) * 0.15,
        vy: 0,
        entered: false,                  /* 整顆進過舞台了沒 */
        ph: Math.random() * 6.28,        /* 搖晃相位 */
        wob: 0.010 + Math.random() * 0.012,
        delay: 0
      };
    });

    /* 出發排程:一組一組放,每組 1~4 顆,組與組之間停一下。
       平均錯開的話看起來像一整串氣球一次放掉,沒有節奏。 */
    var order = parts.map(function(_, k){ return k; });
    for(var a = order.length - 1; a > 0; a--){
      var b = Math.floor(Math.random() * (a + 1));
      var tmp = order[a]; order[a] = order[b]; order[b] = tmp;
    }
    var t = Math.random() * 10, k2 = 0;
    while(k2 < order.length){
      var g = 1 + Math.floor(Math.random() * 4);
      for(var m = 0; m < g && k2 < order.length; m++, k2++){
        parts[order[k2]].delay = t + Math.random() * 14;
      }
      t += 38 + Math.random() * 75;
    }

    mode = 'rise'; calmFrames = 0; riseFrames = 0;
    draw();
  }

  function draw(){
    for(var i = 0; i < parts.length; i++){
      var p = parts[i];
      p.it.el.style.transform = 'translate(' + (p.x - p.r) + 'px,' + (p.y - p.r) + 'px)';
    }
  }
  /* 深度重疊時讓位置修正快一點。平常維持 MAXFIX 的慢速互推(那才是要的手感),
     但一旦疊進去很深(例如視窗突然變小把大家壓在一起),慢慢推要幾十幀才解得開,
     畫面上就是一團。 */
  function fixStep(ov){ return Math.min(ov, MAXFIX + ov * 0.12); }

  /* ── 一幀 ── */
  function frame(){
    var W = SW, H = SH, n = parts.length, i, j, p, q;
    var hb = helpBox(W, H);

    /* ① 浮力 + 阻尼。終端速度 = 浮力 /(1 - 阻尼) ≈ 1.4px/幀 ≈ 每秒 82px。 */
    var buoy = mode === 'rise' ? 0.030 : 0.0025;
    var damp = mode === 'rise' ? 0.978 : 0.972;
    for(i = 0; i < n; i++){
      p = parts[i];
      if(p.delay > 0){ p.delay--; continue; }
      /* 出發:挑一個離「目前在下緣附近的泡泡」最遠的位置,避免一出場就疊在一起。
         候選點集中在中間一帶 —— 散開的話每顆各走各的垂直車道,一路到頂都碰不到
         人,就沒有碰撞感。 */
      if(!p.spawned){
        var bestX = W / 2, bestD = -1;
        for(var c = 0; c < 7; c++){
          var cx2 = Math.max(p.r + 8, Math.min(W - p.r - 8,
                      W / 2 + (Math.random() - 0.5) * W * 0.55));
          var near = 1e9;
          for(var z = 0; z < n; z++){
            var o = parts[z];
            if(o === p || !o.spawned) continue;
            if(o.y < H - 2 * o.r) continue;       /* 已經升上去的不算 */
            near = Math.min(near, Math.abs(o.x - cx2) - (o.r + p.r));
          }
          if(near > bestD){ bestD = near; bestX = cx2; }
        }
        p.x = bestX;
        p.y = H + p.r + 10 + Math.random() * 40;
        p.spawned = true;
      }
      p.vy -= buoy;
      /* 左右搖晃。沒有這一段的話每顆都是直線上升,彼此永遠在自己的車道上。 */
      if(mode === 'rise'){ p.ph += 0.026; p.vx += Math.sin(p.ph) * p.wob; }
      p.vx *= damp; p.vy *= damp;
      p.x += p.vx; p.y += p.vy;
    }

    /* ② 碰撞 + 牆 */
    var rest = mode === 'rise' ? 0.20 : 0.07;
    for(var pass = 0; pass < 2; pass++){
      for(i = 0; i < n; i++){
        for(j = i + 1; j < n; j++){
          p = parts[i]; q = parts[j];
          if(p.delay > 0 || q.delay > 0 || !p.spawned || !q.spawned) continue;
          var dx = q.x - p.x, dy = q.y - p.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          var need = p.r + q.r + GAP;
          if(dist >= need) continue;
          var nx = dx / dist, ny = dy / dist;
          var ov = fixStep(need - dist);
          var tm = p.m + q.m;
          p.x -= nx * ov * (q.m / tm); p.y -= ny * ov * (q.m / tm);
          q.x += nx * ov * (p.m / tm); q.y += ny * ov * (p.m / tm);
          var rvn = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
          if(rvn > 0) continue;
          var imp = -(1 + rest) * rvn / (1 / p.m + 1 / q.m);
          p.vx -= imp * nx / p.m; p.vy -= imp * ny / p.m;
          q.vx += imp * nx / q.m; q.vy += imp * ny / q.m;
        }
      }
      for(i = 0; i < n; i++){
        p = parts[i];
        if(p.delay > 0 || !p.spawned) continue;
        if(p.x - p.r < 6){ p.x = p.r + 6; p.vx = Math.abs(p.vx) * 0.4; }
        if(p.x + p.r > W - 6){ p.x = W - 6 - p.r; p.vx = -Math.abs(p.vx) * 0.4; }
        if(p.y - p.r < 6){ p.y = p.r + 6; p.vy = Math.abs(p.vy) * 0.35; }
        /* 底部的牆只對「已經浮進來」的生效。用距離猜的話,起點落在那個範圍裡的
           一出發就被夾進畫面 —— 看起來是從下緣閃出來而不是浮上來。

           判定用「中心進來」而不是「整顆進來」:擁擠時整顆擠不進去的那顆會永遠
           維持 false,底部的牆就一直不對它生效,被碰撞一路往下推到畫面外很遠。
           中心進來就夾,最多是底緣露出一點,不會跑掉。 */
        if(!p.entered && p.y <= H) p.entered = true;
        if(p.entered && p.y + p.r > H - 6){ p.y = H - 6 - p.r; p.vy = -Math.abs(p.vy) * 0.3; }
        /* 還沒進場的也要有地板,否則被下面那顆頂到就一路往下掉、再也回不來。 */
        if(!p.entered && p.y > H + p.r + 320){ p.y = H + p.r + 320; p.vy = Math.min(p.vy, 0); }
        /* 說明按鈕:被壓到就往外推,推的方向是離開按鈕中心。 */
        if(p.entered && !clearsHelp(hb, p.x, p.y, p.r)){
          var cx = (hb.x0 + hb.x1) / 2, cy = (hb.y0 + hb.y1) / 2;
          var ax = p.x - cx, ay = p.y - cy;
          var al = Math.sqrt(ax * ax + ay * ay) || 0.01;
          p.x += (ax / al) * MAXFIX; p.y += (ay / al) * MAXFIX;
          /* 推完要再夾一次 —— 不然會被推出界(這一段原本在牆的後面)。 */
          p.x = Math.max(p.r + 6, Math.min(W - 6 - p.r, p.x));
          if(p.entered) p.y = Math.max(p.r + 6, Math.min(H - 6 - p.r, p.y));
        }
      }
    }

    draw();

    /* ③ 動能降下來就切到 settle */
    var energy = 0, allIn = true;
    for(i = 0; i < n; i++){
      p = parts[i];
      if(p.delay > 0 || !p.entered){ allIn = false; continue; }
      energy += p.vx * p.vx + p.vy * p.vy;
    }
    if(mode === 'rise'){
      riseFrames++;
      /* 條件是「全部都進場了」,不是「全部都出發了」。settle 之後浮力幾乎歸零,
         還在畫面外的那顆就再也進不來 —— 那等於把它弄丟了,正是零淘汰要防的事。 */
      if(allIn && n && energy / n < 0.06) calmFrames++; else calmFrames = 0;
      /* 兜底:資產少的時候泡泡在頂部自由漂著,上面那段搖晃每幀都在補動能,
         能量門檻永遠達不到,就一直停在 rise。全部進場之後再跑一段就強制切換。 */
      if(calmFrames > 24 || (allIn && riseFrames > 900)) mode = 'settle';
      /* 自我修正:進不去就是尺寸算太大。等夠久還有人卡在外面,整組縮小一點重來,
         跟舊版的「放不下就縮小重試」同一個精神 —— 寧可小一點,不要弄丟任何一支。 */
      else if(!allIn && riseFrames > 1500){ shrinkRetry(); }
    } else {
      /* 微抖:偶爾給一個很小的隨機推力,看起來像還在呼吸、還在互相頂。
         不理會系統的「減少動態效果」—— 這是刻意的。曾經有一版在這裡擋掉,
         結果開了那個設定的裝置(含 iOS 低耗電模式)泡泡浮上來之後完全靜止,
         看起來像壞掉。位移幅度只有幾 px,慢到不構成前庭刺激。 */
      /* 推力大小要回推「位移」來看:位移 ≈ 推力 /(1 - 阻尼)。0.30 配 0.972 是
         10.7px,比 GAP 還大,兩顆相向就疊在一起。0.12 是 4.3px,在 GAP 的一半
         以內。改這個數字之前先算一次。 */
      for(i = 0; i < n; i++){
        if(Math.random() < 0.07){
          parts[i].vx += (Math.random() - 0.5) * 0.12;
          parts[i].vy += (Math.random() - 0.5) * 0.12;
        }
      }
    }

    rafId = requestAnimationFrame(frame);
  }

  /* 整組縮小一成,還沒進場的重新放到下緣外,繼續浮。最多縮到 MINPX。 */
  function shrinkRetry(){
    var W = SW, H = SH, i;
    var SZ = parts.map(function(p){ return Math.max(MINPX, p.r * 2 * 0.90); });
    applySizes(items, SZ.map(function(d){ return Math.round(d); }));
    for(i = 0; i < parts.length; i++){
      var p = parts[i];
      p.r = SZ[i] / 2; p.m = p.r * p.r;
      p.vx *= 0.3; p.vy *= 0.3;
      if(!p.entered){
        p.x = Math.max(p.r + 8, Math.min(W - p.r - 8,
                W / 2 + (Math.random() - 0.5) * W * 0.55));
        p.y = H + p.r + 10 + Math.random() * 40;
      } else {
        p.x = Math.max(p.r + 6, Math.min(W - 6 - p.r, p.x));
        p.y = Math.max(p.r + 6, Math.min(H - 6 - p.r, p.y));
      }
    }
    riseFrames = 0; calmFrames = 0;
  }

  function runPhysics(){
    if(rafId || !parts.length) return;
    rafId = requestAnimationFrame(frame);
  }
  function stopPhysics(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = 0; }
  }

  /* ── 視窗尺寸變了:重算尺寸、把位置按比例搬過去,不重播進場 ──────────
     工具列收合、轉向都會觸發。重播的話使用者每捲一下就要再看一次動畫。 ── */
  function reflow(){
    var W = stage.clientWidth, H = stage.clientHeight;
    if(!W || !H || !parts.length) return;
    var sx = SW ? W / SW : 1, sy = SH ? H / SH : 1;
    var SZ = sizesFor(items, W, H);
    applySizes(items, SZ);
    parts.forEach(function(p, i){
      p.r = SZ[i] / 2; p.m = p.r * p.r;
      p.x = Math.max(p.r + 6, Math.min(W - 6 - p.r, p.x * sx));
      p.y = p.entered ? Math.max(p.r + 6, Math.min(H - 6 - p.r, p.y * sy)) : p.y * sy;
    });
    SW = W; SH = H;
    draw();
  }

  function start(){
    if(started || !items.length) return;
    started = true;
    field.classList.add('live');
    hero.classList.add('gone');
    launch.classList.add('gone');
    runPhysics();
    /* 說明鈕等第一批泡泡進畫面之後再出現,不要一開始就擋在那裡 */
    setTimeout(function(){ helpb.classList.add('show'); }, 2600);
  }

  /* ── 建泡泡。啟動前就放進 HTML(給搜尋引擎),只是還沒浮上來 ── */
  function build(list){
    var L = lang();
    field.innerHTML = list.map(function(a){
      /* 連結要跟著本頁語言走。判斷邏輯統一由 chrome.js 的 window.dcaHref 提供
         (它讀 ZH_READY 清單);還沒載入完就維持英文網址,不會壞掉。 */
      var bh = '/asset/' + a.ticker.toLowerCase() + '.html';
      try { if (typeof window.dcaHref === 'function') bh = window.dcaHref(bh); } catch(e){}
      /* 掃光改成給「最大的那幾顆」,由 applySizes() 加 .shine —— 這裡不標記。
         本週最新那支不另外標示(位置在物理版保證不了,光效也不借用)。 */
      return '<a class="bub" href="' + bh + '" aria-label="' + a.ticker + '">'
        /* logo 網址一律由 js/logo.js 產生(本地圖優先),這裡不再自己拼網址。
           a.img 是先前算好的本地圖,保留當第一順位。 */
        + '<span class="lg"><img src="' + (a.img || (typeof getLogoUrl === 'function' ? (getLogoUrl(a.query || a.ticker, 60) || '') : ''))
        + '" alt="' + a.ticker + '" loading="lazy"></span>'
        + '<span class="tk">' + a.ticker + '</span>'
        + '<span class="sc" style="color:' + scoreCol(a.score) + '">' + a.score + '</span>'
        + '</a>';
    }).join('');
    items = Array.prototype.map.call(field.children, function(el, i){
      /* dev = 分數離 50 多遠,直徑靠它算(見 sizesFor())。
         tier 保留著,色階與其他頁面的分級仍然讀它。 */
      return { el:el, tier:list[i].tier, dev:Math.abs(list[i].score - 50) };
    });
    prepare(items);
  }

  /* ── 抓分數 ── */
  /* auto = true 代表是「離開太久回來」的重抓,抓完直接開始,不用再按一次。 */
  function load(auto){
    var arr = (window.DCA_ASSETS || []).slice();
    if(!arr.length){ document.getElementById('empty').style.display = 'block'; return; }
    Promise.all(arr.map(function(a){
      return fetch(PROXY + '/ticker-score?ticker=' + encodeURIComponent(a.query || a.ticker))
        .then(function(r){ return r.json(); })
        .then(function(j){
          var s = (j && (j.score != null ? j.score : (j.data && j.data.score)));
          if(s == null || !isFinite(s)) return null;
          /* query 一併帶著:加密貨幣的 query 是 BTC-USD 這種帶後綴的形式,
             logo 要靠它才認得出是加密貨幣、走對路徑。 */
          return { ticker:a.ticker, domain:a.domain, query:a.query,
                   img:(window.DCA_LOGO_IMG || {})[(a.ticker || '').toUpperCase()] || null,
                   score:Math.round(s) };
        })
        .catch(function(){ return null; });
    })).then(function(res){
      var list = res.filter(Boolean).map(function(a, i){
        a.tier = tier(a.score);
        return a;
      });
      if(!list.length){ document.getElementById('empty').style.display = 'block'; return; }
      build(list);
      launch.disabled = false;
      if(auto) start();
    });
  }

  /* ── 事件 ── */
  launch.addEventListener('click', start);
  helpb.addEventListener('click', function(e){
    e.stopPropagation();
    helpb.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if(helpb.classList.contains('open') && !helpb.contains(e.target)){
      helpb.classList.remove('open');
    }
  });
  window.addEventListener('resize', function(){
    if(items.length) reflow();
  });

  /* 桌機的頁首是 position:fixed(chrome.js),量它的高度讓出上緣,
     泡泡場也跟著扣掉,整頁才剛好一個視窗、不會多出捲軸。 */
  function syncNav(){
    var nav = document.querySelector('#siteHeader nav');
    var h = nav ? nav.getBoundingClientRect().height : 0;
    var fixed = !!nav && getComputedStyle(nav).position === 'fixed';
    /* 上緣補償只有 fixed 時需要(它脫離排版流,不會把內容往下推)。 */
    document.documentElement.style.setProperty('--navh', (fixed ? Math.round(h) : 0) + 'px');
    /* 舞台高度兩種情況都要扣:fixed 時是被 body 的 padding 推下來,
       一般排版流時是被頁首本身推下來,可用高度都是 100svh - 頁首高。 */
    document.documentElement.style.setProperty('--hdrh', Math.round(h) + 'px');

    /* 量實際看得見的高度,不信任 CSS 單位。visualViewport 回報的是瀏覽器
       工具列扣掉之後真正可見的區域;舞台上緣的位置直接從它自己的方框讀。
       兩者相減就是舞台能用的高度。 */
    var vv = window.visualViewport;
    var seen = vv ? vv.height : window.innerHeight;
    var top = stage.getBoundingClientRect().top;
    var avail = Math.round(seen - top);
    /* 太小的值八成是工具列動畫中途量到的,寧可維持上一次 */
    if(avail > 160) document.documentElement.style.setProperty('--stageh', avail + 'px');

    if(items.length) reflow();
  }
  window.addEventListener('resize', syncNav);
  window.addEventListener('load', syncNav);
  /* 工具列收合、網址列展開都只會觸發 visualViewport 的事件,不會觸發 window resize */
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', syncNav);
    window.visualViewport.addEventListener('scroll', syncNav);
  }
  setTimeout(syncNav, 0); setTimeout(syncNav, 400); setTimeout(syncNav, 1200);

  /* ── 分頁切走就停,回到畫面再接上 ────────────────────────────────────
     物理是持續在跑的 rAF,看不到的時候跑它只是在耗電。瀏覽器自己也會節流背景
     分頁,但節流的程度各家不同,明確停掉比較可靠。

     回來時如果已經離開超過五分鐘,順便重抓一次分數 —— 放著不動的分頁再回來,
     看到的是舊數字。重抓會重建泡泡、重播一次進場,這是刻意的:數字都換了,
     沿用舊版面反而奇怪。 ── */
  var hiddenAt = 0, REFRESH_AFTER = 5 * 60 * 1000;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      hiddenAt = Date.now();
      stopPhysics();
    } else {
      var away = hiddenAt ? Date.now() - hiddenAt : 0;
      hiddenAt = 0;
      if(started && away > REFRESH_AFTER){
        stopPhysics();
        started = false;                 /* 讓 load() 重建之後能再啟動一次 */
        load(true);
        return;
      }
      syncNav();
      if(started) runPhysics();
    }
  });

  applyLang();
  launch.disabled = true;     /* 分數還沒回來之前不讓按,避免按了沒反應 */
  load();
})();
</script>

<script src="/chrome.js?v=12"></script>
