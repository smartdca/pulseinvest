<!-- System font stack: no external font loading needed -->
<style>
:root{--font-sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;--bg:#fbfbfd;--bg2:#f5f5f7;--surface:#fff;--border:#e6e6ea;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9f;--accent:#c8813a;--al:#faf3e8;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-.1px;}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.05);}
.nav-logo{display:flex;align-items:center;text-decoration:none;}
.nav-back{font-size:12px;color:var(--ink2);text-decoration:none;font-family:var(--font-sans);}
.nav-back:hover{color:var(--accent);}
.wrap{max-width:520px;margin:0 auto;padding:32px 18px 0;}
.page-hero{text-align:center;padding:22px 0 30px;}
.page-tag{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--accent);font-weight:600;font-family:var(--font-sans);margin-bottom:14px;}
.page-title{font-family:var(--font-sans);font-size:29px;font-weight:650;line-height:1.18;letter-spacing:-.6px;margin-bottom:12px;}
.page-title em{font-style:normal;color:var(--accent);}
.page-sub{color:var(--ink2);font-size:14px;line-height:1.6;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-lang{display:flex;gap:6px;}
.nav-lang .lang-btn{padding:4px 12px;font-size:11px;border-radius:16px;}
.lang-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;font-family:var(--font-sans);transition:all .25s cubic-bezier(.4,0,.2,1);}
.lang-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.posts-list{display:flex;flex-direction:column;gap:14px;}
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .2s,transform .15s;text-decoration:none;display:block;}
.post-card:active{transform:scale(.98);box-shadow:none;}
.post-thumb{width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg2);}
.post-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.post-body{padding:17px 19px;}
.post-meta{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.post-tag{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-family:var(--font-sans);font-weight:600;background:var(--al);padding:3px 9px;border-radius:10px;}
.post-date{font-size:11px;color:var(--ink3);font-family:var(--font-sans);}
.post-read{font-size:11px;color:var(--ink3);font-family:var(--font-sans);margin-left:auto;}
.post-title{font-family:var(--font-sans);font-size:18px;font-weight:650;line-height:1.25;color:var(--ink);margin-bottom:9px;letter-spacing:-.2px;}
.post-teaser{font-size:13px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-cta{font-size:11px;color:var(--accent);font-family:var(--font-sans);margin-top:11px;}
.empty{text-align:center;padding:44px 20px;color:var(--ink3);font-size:13px;font-family:var(--font-sans);}
.site-footer{background:var(--bg2);border-top:1px solid var(--border);padding:30px 20px 44px;margin-top:34px;}
.site-footer-inner{max-width:520px;margin:0 auto;}
.site-footer-top{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;background:var(--surface);padding:15px 17px;border-radius:14px;box-shadow:var(--sh);}
.footer-brand{display:flex;align-items:center;flex-shrink:0;}
.footer-brand span{color:var(--accent);}
.footer-links{display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
.footer-links a{font-size:14px;color:var(--ink2);text-decoration:none;}
.footer-links a:hover{color:var(--ink);}
.site-footer-top a{-webkit-text-decoration:none;text-decoration:none;background:transparent !important;color:var(--ink2) !important;font-size:14px;white-space:nowrap;}
.footer-divider{height:1px;background:var(--border);margin-bottom:16px;}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.footer-copy{font-size:11px;color:var(--ink3);font-family:var(--font-sans);}
.footer-disclaimer{font-size:11px;color:var(--ink3);line-height:1.6;margin-top:12px;}

/* ═══════════════════════════════════════════════════════════════
   桌機版(2026-08-20新增,v62修正版面)—— 這支頁面原本只有手機版
   (.wrap寫死520px,完全沒有media query)。漢堡選單樣式已經在chrome.js
   裡處理(這支頁面用共用header/footer),這裡只負責內文排版。
   版面(跟Henry對過蘋果Newsroom參考):第一篇=寬版矩形主打文章
   (1100寬×480高);其餘文章兩兩並排、接近正方形(同樣480高)。
   卡片視覺語言呼應首頁v61(全滿版圖片+底部漸層+文字疊層)。
   進場動畫:每組卡片捲到快進入畫面時淡入+往上浮,而且「每次」捲過去
   都重播(不是像本週精選那樣只演一次)——這裡跟Henry確認過是刻意的
   差異,因為這裡只有主打+兩兩幾張大卡片,不會有「太吵」的問題。
   標題捲動遮蓋效果(2026-08-20新增,只有這頁做,Henry明確說每頁獨立設計
   不強制比照辦理):比照蘋果Newsroom——page-hero(標籤+標題+介紹文字)
   固定定位不動,下面的posts-list是正常捲動內容、疊在上層、背景不透明,
   一開始捲動posts-list就會像簾幕一樣往上滑過去蓋住page-hero,捲回頂端
   則反向露出。實際px數值(nav高度/page-hero高度)不能寫死——中英文文字
   長度不同、字級也可能調整——交給下面的JS動態量測,比照全站既有
   syncNavOffset()的模式。
   ═══════════════════════════════════════════════════════════════ */
@media (min-width: 960px) {
  .wrap { max-width: 1100px; padding: 0 40px 0; }
  .page-hero {
    padding: 20px 0 48px;
    max-width: 900px;
    margin: 0 auto;
    position: fixed;
    left: 0; right: 0;
    z-index: 1;
    background: var(--bg);
  }
  /* 大標文字比照首頁hero既有的五級字體系統(2026-08-17定案),不是這頁
     自己另外訂一套數字:大標76px/內文19px/微標籤13px。 */
  .page-tag { font-size: 13px; letter-spacing: 3px; margin-bottom: 22px; }
  .page-title { font-size: 76px; line-height: 1.08; letter-spacing: -2.4px; margin-bottom: 28px; }
  .page-sub { font-size: 19px; line-height: 1.7; max-width: 900px; margin-left: auto; margin-right: auto; }

  .posts-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    position: relative;
    z-index: 2;
    background: var(--bg);
    padding-bottom: 40px;
  }
  /* 第一篇=主打,橫跨兩欄、寬版矩形 */
  .posts-list .post-card:first-child {
    grid-column: 1 / -1;
    height: 480px;
  }
  .posts-list .post-card:not(:first-child) {
    height: 480px;
  }

  /* 全滿版圖片鋪底+底部漸層+文字疊層,呼應首頁v61同一套編輯感語言。
     transform同時被hover(浮起)跟reveal進場動畫共用,統一寫在這裡,
     不要分散定義。 */
  .post-card {
    position: relative;
    border-radius: 26px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .6s ease, transform .6s ease, box-shadow .2s ease;
  }
  .post-card.reveal {
    opacity: 1;
    transform: translateY(0);
  }
  .post-card.reveal:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0,0,0,.1), 0 24px 50px rgba(0,0,0,.14);
  }
  .post-thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    aspect-ratio: auto;
  }
  .post-thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%);
  }
  .post-body {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 32px 34px 30px;
    z-index: 1;
  }
  .post-card:first-child .post-body { max-width: 620px; }
  .post-meta { margin-bottom: 12px; }
  .post-tag { background: rgba(255,255,255,.16); color: #fff; }
  .post-date, .post-read { color: rgba(255,255,255,.7); }
  .post-title { color: #fff; margin-bottom: 10px; }
  .posts-list .post-card:first-child .post-title { font-size: 30px; }
  .posts-list .post-card:not(:first-child) .post-title { font-size: 19px; }
  .post-teaser { color: rgba(255,255,255,.82); }
  .posts-list .post-card:not(:first-child) .post-teaser,
  .posts-list .post-card:not(:first-child) .post-cta { display: none; }
  .post-cta { color: #fff; font-weight: 600; }

  .site-footer-inner { max-width: 1100px; }
}
</style>
</head>
<body>
<!-- 共用頁首(chrome.js 注入) -->
<div id="siteHeader"></div>

<div class="wrap">
  <div class="page-hero">
    <div class="page-tag" id="t-tag">Insights</div>
    <h1 class="page-title" id="t-title">Ideas worth <em>investing in.</em></h1>
    <p class="page-sub" id="t-sub">Stay on top of financial news, strategy analysis, market insights, and expert interviews from leading publications around the world — helping you invest with confidence.</p>
  </div>

  <div class="posts-list" id="postsList">
    <div class="empty" id="t-loading">Loading...</div>
  </div>
</div>

<!-- 共用頁尾(chrome.js 注入) -->
<div id="siteFooter"></div>

<!-- PWA Install Modal(對齊index.html/jury.html的版本) -->
<script>
let currentLang = localStorage.getItem('dcacafe_lang') || 'en';
let allPosts = [];

const T = {
  en: {
    tag: 'Insights',
    title: 'Ideas worth <em>investing in.</em>',
    sub: 'Stay on top of financial news, strategy analysis, market insights, and expert interviews from leading publications around the world — helping you invest with confidence.',
    back: '← Back',
    loading: 'Loading...',
    empty: 'No posts yet. Check back soon.',
    readmore: 'Read →',
    footerInsights: 'Insights',
    footerPrivacy: 'Privacy Policy',
    footerCopy: '© 2026 DCAcafé. All rights reserved.',
    footerDisclaimer: 'DCAcafé is an informational tool only and does not constitute financial or investment advice. All investment decisions are made solely at your own risk. Past performance is not indicative of future results. Market data provided by Yahoo Finance.',
    pwaTagline: 'An investing experience designed around you.',
    pwaStep1: 'Tap the <strong style="color:#c8813a;">Share</strong> icon in the toolbar below (the square with an arrow)',
    pwaStep2: 'Scroll down and tap <strong style="color:#c8813a;">"Add to Home Screen"</strong>',
    pwaStep3: 'Tap <strong style="color:#c8813a;">"Add"</strong> in the top right — done! The DCAcafé icon will appear on your home screen.',
    pwaGot: 'Got it'
  },
  zh: {
    tag: '投資見解',
    title: '值得<em>投入的想法。</em>',
    sub: '掌握來自世界各地頂尖出版刊物的財經新聞、策略分析、市場觀點、專家訪談——幫助你有信心地投資。',
    back: '← 返回',
    loading: '載入中...',
    empty: '尚無文章，敬請期待。',
    readmore: '閱讀 →',
    footerInsights: '投資見解',
    footerPrivacy: '隱私政策',
    footerCopy: '© 2026 DCAcafé 版權所有',
    footerDisclaimer: 'DCAcafé 僅供參考，不構成任何投資建議。所有投資決策風險由使用者自行承擔。過去績效不代表未來結果。市場數據來源：Yahoo Finance。',
    pwaTagline: '圍繞你而設計的投資體驗。',
    pwaStep1: '點下方工具列的 <strong style="color:#c8813a;">分享</strong> 圖示（方框加向上箭頭）',
    pwaStep2: '往下滑，點選 <strong style="color:#c8813a;">「加入主畫面」</strong>',
    pwaStep3: '點右上角 <strong style="color:#c8813a;">「新增」</strong>，完成！桌面會出現 DCAcafé 圖示。',
    pwaGot: '知道了'
  }
};

function applyLang(lang) {
  const t = T[lang];
  document.getElementById('t-tag').textContent = t.tag;
  document.getElementById('t-title').innerHTML = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  if(allPosts.length) renderPosts(allPosts, lang);
  // 語言切換後文字長度可能改變(中英文字數差異大),重新量測page-hero高度
  if (typeof syncHeroCover === 'function') setTimeout(syncHeroCover, 50);
}

function setLang(lang, e) {
  currentLang = lang;
  localStorage.setItem('dcacafe_lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  applyLang(lang);
}

function renderPosts(posts, lang) {
  const zh = lang === 'zh';
  const list = document.getElementById('postsList');
  if(!posts.length) {
    list.innerHTML = `<div class="empty">${T[lang].empty}</div>`;
    return;
  }
  list.innerHTML = '';
  posts.forEach(post => {
    const a = document.createElement('a');
    a.className = 'post-card';
    a.href = `blog/${post.slug}.html`;
    a.innerHTML = `
      <div class="post-thumb">
        <img src="${post.hero_image}" alt="${zh ? post.title_zh : post.title_en}" loading="lazy">
      </div>
      <div class="post-body">
        <div class="post-meta">
          <span class="post-tag">${zh ? post.tag_zh : post.tag_en}</span>
          <span class="post-date">${post.date}</span>
          <span class="post-read">${post.read_time} min</span>
        </div>
        <div class="post-title">${zh ? post.title_zh : post.title_en}</div>
        <div class="post-teaser">${zh ? post.teaser_zh : post.teaser_en}</div>
        <div class="post-cta">${T[lang].readmore}</div>
      </div>`;
    list.appendChild(a);
  });
  setupScrollReveal();
}

// 桌機限定(手機版CSS完全沒有.reveal相關規則,這裡在手機上是安全的no-op,
// 只是白白加class沒有視覺效果)。2026-08-20新增,跟Henry確認過:這裡「每次」
// 捲過去都要重播淡入+浮起動畫,不是像本週精選那樣整次造訪只演一次——
// 因為這裡只有主打+兩兩幾張大卡片,數量少,重播不會有「太吵」的問題。
// 做法:進畫面加.reveal、離開畫面拿掉.reveal,離開後class被清空,
// 下次再進來CSS transition會重新從頭播放一次。
let _postsRevealObserver = null;
function setupScrollReveal() {
  if (typeof IntersectionObserver === 'undefined') {
    // 不支援的環境,安全降級:直接顯示,不做動畫
    document.querySelectorAll('.post-card').forEach(el => el.classList.add('reveal'));
    return;
  }
  if (_postsRevealObserver) _postsRevealObserver.disconnect();
  _postsRevealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      entry.target.classList.toggle('reveal', entry.isIntersecting);
    });
  }, { threshold: 0.2 });
  document.querySelectorAll('.post-card').forEach(el => _postsRevealObserver.observe(el));
}

async function loadPosts() {
  try {
    const res = await fetch('blog/index.json?v=' + Date.now());
    if(!res.ok) throw new Error('Failed');
    allPosts = await res.json();
    renderPosts(allPosts, currentLang);
  } catch(e) {
    document.getElementById('postsList').innerHTML = `<div class="empty">${T[currentLang].empty}</div>`;
  }
}

// 桌機限定(2026-08-20新增):標題捲動遮蓋效果的實際px數值——nav高度、
// page-hero實際渲染高度(中英文文字長度不同,不能寫死)——這裡動態量測,
// 比照全站既有syncNavOffset()同一套模式(見index.html)。手機版<960明確
// 清空inline style,避免視窗縮小時殘留桌機數值污染手機版版面。
function syncHeroCover() {
  const hero = document.querySelector('.page-hero');
  const list = document.getElementById('postsList');
  if (!hero || !list) return;
  if (window.innerWidth < 960) {
    hero.style.top = '';
    list.style.marginTop = '';
    return;
  }
  const nav = document.querySelector('#siteHeader nav') || document.querySelector('nav');
  const navH = nav ? nav.getBoundingClientRect().height : 0;
  hero.style.top = navH + 'px';
  // page-hero此時已經是position:fixed,量它目前的高度(padding都算在內)
  const heroH = hero.getBoundingClientRect().height;
  list.style.marginTop = (navH + heroH) + 'px';
}
let heroCoverResizeTimer = null;
function debouncedSyncHeroCover() {
  clearTimeout(heroCoverResizeTimer);
  heroCoverResizeTimer = setTimeout(syncHeroCover, 150);
}
window.addEventListener('resize', debouncedSyncHeroCover);
window.addEventListener('orientationchange', () => setTimeout(syncHeroCover, 100));
// chrome.js非同步注入nav,量測要等它真的插入DOM後才準——用短暫輪詢等待,
// 比起猜測一個固定的setTimeout毫秒數更保險。
function waitForNavThenSync(triesLeft) {
  const nav = document.querySelector('#siteHeader nav');
  if (nav || triesLeft <= 0) { syncHeroCover(); return; }
  setTimeout(() => waitForNavThenSync(triesLeft - 1), 50);
}
waitForNavThenSync(20);


// Init — 語言由共用 chrome 管;本頁只重繪自己的內文
window.applyPageLang = function(lang){ currentLang = (lang === "zh") ? "zh" : "en"; applyLang(currentLang); };
applyLang(currentLang);
loadPosts();
</script>
<script src="/chrome.js"></script>
</body>
</html>
