<!-- 桌機預覽開關(補上,跟index.html同一套機制,共用localStorage
     key,兩頁狀態互通):網址加 ?desktop=1 → 強制 1200 版面;?desktop=1 後
     會記住,之後直接開也維持;?desktop=0 → 還原手機版。必須放在 viewport
     之後、CSS 之前,才能在首次繪製前套用。 -->
<script>
(function(){
  try{
    var s = location.search || '';
    if(/[?&]desktop=0(\b|$)/.test(s)){ localStorage.removeItem('forceDesktop'); }
    else if(/[?&]desktop=1(\b|$)/.test(s)){ localStorage.setItem('forceDesktop','1'); }
    if(localStorage.getItem('forceDesktop')==='1'){
      var vp = document.querySelector('meta[name="viewport"]');
      if(vp){ vp.setAttribute('content','width=1200'); }
      document.documentElement.setAttribute('data-preview-desktop','1');
    }
  }catch(e){}
})();
</script>

/* ═══════════════════════════════════════════════════════════════
   桌機版(新增,v62修正版面)—— 這支頁面原本只有手機版
   (.wrap寫死520px,完全沒有media query)。漢堡選單樣式已經在chrome.js
   裡處理(這支頁面用共用header/footer),這裡只負責內文排版。
   版面(跟Henry對過蘋果Newsroom參考):第一篇=寬版矩形主打文章
   (1100寬×480高);其餘文章兩兩並排、接近正方形(同樣480高)。
   卡片視覺語言呼應首頁v61(全滿版圖片+底部漸層+文字疊層)。
   進場動畫:每組卡片捲到快進入畫面時淡入+往上浮,而且「每次」捲過去
   都重播(不是像本週精選那樣只演一次)——這裡跟Henry確認過是刻意的
   差異,因為這裡只有主打+兩兩幾張大卡片,不會有「太吵」的問題。
   標題捲動遮蓋效果(新增,只有這頁做,Henry明確說每頁獨立設計
   不強制比照辦理):比照蘋果Newsroom——page-hero(標籤+標題+介紹文字)
   固定定位不動,下面的posts-list是正常捲動內容、疊在上層、背景不透明,
   一開始捲動posts-list就會像簾幕一樣往上滑過去蓋住page-hero,捲回頂端
   則反向露出。實際px數值(nav高度/page-hero高度)不能寫死——中英文文字
   長度不同、字級也可能調整——交給下面的JS動態量測,比照全站既有
   syncNavOffset()的模式。
   ═══════════════════════════════════════════════════════════════ */
@media (min-width: 960px) {
  .wrap { max-width: 1100px; padding: 0 40px 0; }
  .page-hero {
    padding: 20px 0 48px;
    max-width: 900px;
    margin: 0 auto;
    position: fixed;
    left: 0; right: 0;
    z-index: 1;
    background: var(--bg);
    /* 新增:字體縮小+被遮蔽要「同步」發生(Henry明確要求),
       這裡的scale/opacity是捲動即時連動(見下方JS的onHeroScroll),
       不能加transition,不然會有延遲感、跟捲動位置對不上。
       transform-origin設在頂部置中,縮小是往上緣收攏,不是從正中心。 */
    transform-origin: 50% 0%;
    will-change: transform, opacity;
  }
  /* 大標文字比照首頁hero既有的五級字體系統(定案),不是這頁
     自己另外訂一套數字:大標76px/內文19px/微標籤13px。 */
  .page-tag { font-size: 13px; letter-spacing: 3px; margin-bottom: 22px; }
  .page-title { font-size: 76px; line-height: 1.08; letter-spacing: -2.4px; margin-bottom: 28px; }
  .page-sub { font-size: 19px; line-height: 1.7; max-width: 900px; margin-left: auto; margin-right: auto; }

  /* 分類橫排改版:posts-list 在桌機只留第一張=主打大卡,其餘文章改由
     下方 .cat-rows 依分類分排、橫向滑動呈現。posts-list 本身仍是
     z-index:2、不透明背景的那層「簾幕」,.cat-rows 放在它裡面,
     捲動遮蓋 page-hero 的效果完全不受影響。 */
  .posts-list {
    display: block;
    position: relative;
    z-index: 2;
    background: var(--bg);
    padding-bottom: 80px;
  }
  /* 第一篇=主打,寬版矩形,文字疊在圖上(雜誌封面感) */
  .posts-list > .post-card:first-child {
    height: 480px;
  }
  /* 平鋪的其餘卡片是手機版用的,桌機藏起來(lazy圖片不會被載入) */
  .posts-list > .post-card:not(:first-child) {
    display: none;
  }
  .posts-list > .post-card:first-child .post-thumb img {
    transition: transform .6s ease;
  }
  /* iOS Safari圓角修正:圖片有transform時會被抽成獨立GPU圖層,
     外層overflow:hidden的圓角有時切不到(閃爍、時有時無)。
     裁切改在圖片容器上做:isolation加全白遮罩,強制照圓角裁切。
     遮罩放在容器而不是卡片本身,卡片hover的陰影才不會被一起切掉。 */
  .posts-list > .post-card:first-child .post-thumb {
    border-radius: inherit;
    overflow: hidden;
    isolation: isolate;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
  }
  @media (hover: hover) and (pointer: fine) {
    .posts-list > .post-card.reveal:first-child:hover .post-thumb img {
      transform: scale(1.04);
    }
  }

  /* 全滿版圖片鋪底+底部漸層+文字疊層,呼應首頁v61同一套編輯感語言。
     transform同時被hover(浮起)跟reveal進場動畫共用,統一寫在這裡,
     不要分散定義。 */
  .post-card {
    position: relative;
    border-radius: 26px;
    overflow: hidden;
    opacity: 0;
    /* 修正:原本translateY(28px)行程太短,浮起效果不明顯——
       改用「位移加大+輕微縮放」組合(不是單純加大間距),突顯彈出感。 */
    transform: translateY(52px) scale(.96);
    transition: opacity .6s ease, transform .6s ease, box-shadow .2s ease;
  }
  .post-card.reveal {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .post-card.reveal:hover {
    transform: translateY(-4px) scale(1);
    box-shadow: 0 10px 24px rgba(0,0,0,.1), 0 24px 50px rgba(0,0,0,.14);
    transition-delay: 0s;
  }
  .post-thumb {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    aspect-ratio: auto;
  }
  .post-thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%);
  }
  .post-body {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 32px 34px 30px;
    z-index: 1;
  }
  .post-card:first-child .post-body { max-width: 620px; }
  .post-meta { margin-bottom: 12px; }
  .post-tag { background: rgba(255,255,255,.16); color: #fff; }
  .post-date, .post-read { color: rgba(255,255,255,.7); }
  .post-title { color: #fff; margin-bottom: 10px; }
  .posts-list .post-card:first-child .post-title { font-size: 30px; }
  .post-teaser { color: rgba(255,255,255,.82); }
  .post-cta { color: #fff; font-weight: 600; }

  /* ── 分類橫排 ──
     每排:標題列(分類名+系列標籤+篇數,右側左右箭頭)+橫向滑動軌道。
     .wrap內容寬1020(1100扣掉左右padding),卡片300×225(4:3):
     一排露出3張+第4張約60px(1020 = 3×300 + 3×20 + 60),暗示可以往右滑。 */
  .cat-rows {
    display: flex;
    flex-direction: column;
    gap: 64px;
    margin-top: 80px;
  }
  .cat-row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    margin-bottom: 18px;
  }
  .cat-row-label { display: flex; align-items: baseline; gap: 12px; }
  .cat-row-title { font-size: 26px; font-weight: 700; letter-spacing: -.5px; color: var(--ink); }
  .cat-row-badge {
    font-size: 11px; letter-spacing: 1.5px; font-weight: 600;
    color: #8a5420; background: var(--al);
    padding: 3px 9px; border-radius: 10px; align-self: center;
  }
  .cat-row-nav { display: flex; gap: 8px; }
  .cat-row-nav.is-hidden { display: none; }
  .cat-nav-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  .cat-nav-btn:disabled { opacity: .35; cursor: default; }
  @media (hover: hover) and (pointer: fine) {
    .cat-nav-btn:not(:disabled):hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  }
  /* 軌道上下預留空間(padding+負margin抵銷),卡片hover浮起放大時
     不會被overflow切掉。 */
  .cat-track {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    padding: 14px 0 24px;
    margin: -14px 0 -24px;
  }
  .cat-track::-webkit-scrollbar { display: none; }

  /* 橫式模糊延伸卡:上方16:9原圖(下半部淡出),下方用同一張圖的
     放大模糊版鋪底,文字疊在兩者交界上。模糊用一般filter,
     不是backdrop-filter(後者會劫持fixed定位)。 */
  .row-card {
    flex: 0 0 300px;
    height: 225px;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    display: block;
    text-decoration: none;
    background: #2a2a2e;
    scroll-snap-align: start;
    opacity: 0;
    transform: translateY(40px) scale(.96);
    transition: opacity .6s ease, transform .6s ease, box-shadow .25s ease;
    transition-delay: calc(var(--i, 0) * .08s);
  }
  .cat-row.reveal .row-card {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  @media (hover: hover) and (pointer: fine) {
    .cat-row.reveal .row-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 12px 26px rgba(0,0,0,.14), 0 26px 52px rgba(0,0,0,.18);
      transition: transform .25s ease, box-shadow .25s ease;
      transition-delay: 0s;
    }
    .row-card:hover .row-card-img { transform: scale(1.06); }
  }
  /* 圖片容器:圓角裁切在這裡做(同主打卡的Safari修正) */
  .row-card-media {
    position: absolute; inset: 0;
    border-radius: inherit;
    overflow: hidden;
    isolation: isolate;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
  }
  .row-card-blur {
    position: absolute;
    left: -40px; top: -40px;
    width: calc(100% + 80px); height: calc(100% + 80px);
    object-fit: cover;
    filter: blur(26px) saturate(1.35) brightness(.55);
  }
  .row-card-img {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 75%;
    object-fit: cover;
    -webkit-mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
    transition: transform .5s ease;
  }
  .row-card-body {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 20px 18px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .row-card-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,.72); }
  .row-card-tag {
    font-size: 10px; letter-spacing: 1.2px; font-weight: 600; text-transform: uppercase;
    color: #fff; background: rgba(255,255,255,.18);
    padding: 2px 8px; border-radius: 9px;
  }
  /* 文字固定兩行:標題+換行+摘要放在同一個兩行截斷的區塊裡。
     標題兩行→摘要被截掉;標題一行→第二行由摘要補滿;標題超過兩行→截斷。
     兩種字共用固定行高24px,每張卡片永遠是「日期列+兩行字」,
     左右水平對齊、底部不留白。 */
  .row-card-text {
    height: 48px;
    line-height: 24px;
    color: rgba(255,255,255,.85);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row-card-title { font-size: 17px; font-weight: 650; color: #fff; }
  .row-card-teaser { font-size: 14px; font-weight: 400; color: rgba(255,255,255,.72); }
  /* 「查看全部」入口卡:淺底、無圖,一眼看出是導覽用而不是文章 */
  .row-card.row-viewall {
    background: var(--bg2);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; cursor: pointer; font-family: var(--font-sans);
  }
  .row-viewall-arrow {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--ink);
  }
  .row-viewall-text { font-size: 15px; font-weight: 600; color: var(--ink); }

  .site-footer-inner { max-width: 1100px; }
}
</style>
</head>
<body>
<!-- 共用頁首(chrome.js 注入) -->
<div id="siteHeader"></div>

<div class="wrap">
  <div class="page-hero">
    <div class="page-tag" id="t-tag">Insights</div>
    <h1 class="page-title" id="t-title">Ideas worth <em>investing in.</em></h1>
    <p class="page-sub" id="t-sub">Stay on top of financial news, strategy analysis, market insights, and expert interviews from leading publications around the world — helping you invest with confidence.</p>
  </div>

  <div class="posts-list" id="postsList">
    <div class="empty" id="t-loading">Loading...</div>
  </div>
</div>

<!-- 共用頁尾(chrome.js 注入) -->
<div id="siteFooter"></div>

<!-- PWA Install Modal(對齊index.html/jury.html的版本) -->
<script>
let currentLang = (window.DCA_LANG === 'zh') ? 'zh' : 'en';   // 由網址鎖定(head 的 DCA_LANG)，不再讀 localStorage
let allPosts = [];

const T = {
  en: {
    tag: 'Insights',
    title: 'Ideas worth <em>investing in.</em>',
    sub: 'Stay on top of financial news, strategy analysis, market insights, and expert interviews from leading publications around the world — helping you invest with confidence.',
    back: '← Back',
    loading: 'Loading...',
    empty: 'No posts yet. Check back soon.',
    readmore: 'Read →',
    series: 'Series',
    rowPrev: 'Previous',
    rowNext: 'Next',
    viewAll: n => 'View all ' + n,
    footerInsights: 'Insights',
    footerPrivacy: 'Privacy Policy',
    footerCopy: '© 2026 DCAcafé. All rights reserved.',
    footerDisclaimer: 'DCAcafé is an informational tool only and does not constitute financial or investment advice. All investment decisions are made solely at your own risk. Past performance is not indicative of future results. Market data provided by Yahoo Finance.',
    pwaTagline: 'An investing experience designed around you.',
    pwaStep1: 'Tap the <strong style="color:#c8813a;">Share</strong> icon in the toolbar below (the square with an arrow)',
    pwaStep2: 'Scroll down and tap <strong style="color:#c8813a;">"Add to Home Screen"</strong>',
    pwaStep3: 'Tap <strong style="color:#c8813a;">"Add"</strong> in the top right — done! The DCAcafé icon will appear on your home screen.',
    pwaGot: 'Got it'
  },
  zh: {
    tag: '投資見解',
    title: '值得<em>投入的想法。</em>',
    sub: '掌握來自世界各地頂尖出版刊物的財經新聞、策略分析、市場觀點、專家訪談——幫助你有信心地投資。',
    back: '← 返回',
    loading: '載入中...',
    empty: '尚無文章，敬請期待。',
    readmore: '閱讀 →',
    series: '系列',
    rowPrev: '上一頁',
    rowNext: '下一頁',
    viewAll: n => '查看全部 ' + n + ' 篇',
    footerInsights: '投資見解',
    footerPrivacy: '隱私政策',
    footerCopy: '© 2026 DCAcafé 版權所有',
    footerDisclaimer: 'DCAcafé 僅供參考，不構成任何投資建議。所有投資決策風險由使用者自行承擔。過去績效不代表未來結果。市場數據來源：Yahoo Finance。',
    pwaTagline: '圍繞你而設計的投資體驗。',
    pwaStep1: '點下方工具列的 <strong style="color:#c8813a;">分享</strong> 圖示（方框加向上箭頭）',
    pwaStep2: '往下滑，點選 <strong style="color:#c8813a;">「加入主畫面」</strong>',
    pwaStep3: '點右上角 <strong style="color:#c8813a;">「新增」</strong>，完成！桌面會出現 DCAcafé 圖示。',
    pwaGot: '知道了'
  }
};

function applyLang(lang) {
  const t = T[lang];
  document.getElementById('t-tag').textContent = t.tag;
  document.getElementById('t-title').innerHTML = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  if(allPosts.length) renderPosts(allPosts, lang);
  // 語言切換後文字長度可能改變(中英文字數差異大),重新量測page-hero高度
  if (typeof syncHeroCover === 'function') setTimeout(syncHeroCover, 50);
}

function setLang(lang, e) {
  currentLang = lang;
  /* 鎖定頁不再寫 localStorage，語言以網址為準 */
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  applyLang(lang);
}

function renderPosts(posts, lang) {
  const zh = lang === 'zh';
  const list = document.getElementById('postsList');
  if(!posts.length) {
    list.innerHTML = `<div class="empty">${T[lang].empty}</div>`;
    return;
  }
  list.innerHTML = '';
  posts.forEach(post => {
    const a = document.createElement('a');
    a.className = 'post-card';
    /* lang-ok(a):文章連結刻意維持相對路徑——從 /insights.html 連到 /blog/xxx.html,
       從 /zh/insights.html 連到 /zh/blog/xxx.html,語言自動對上。不要改成絕對路徑。 */
    a.href = `blog/${post.slug}.html`;
    /* index.json 存的是 'blog/img/xxx.jpg' 這種相對路徑,
       在 /zh/insights.html 會被解析成 /zh/blog/img/xxx.jpg(不存在)→ 縮圖全掛。
       圖片只有 blog/img/ 一份,中英共用,所以補成根目錄絕對路徑。 */
    const thumb = /^https?:\/\//.test(post.hero_image)
      ? post.hero_image
      : '/' + String(post.hero_image).replace(/^\/+/, '');
    a.innerHTML = `
      <div class="post-thumb">
        <img src="${thumb}" alt="${zh ? post.title_zh : post.title_en}" loading="lazy">
      </div>
      <div class="post-body">
        <div class="post-meta">
          <span class="post-tag">${zh ? post.tag_zh : post.tag_en}</span>
          <span class="post-date">${post.date}</span>
          <span class="post-read">${post.read_time} min</span>
        </div>
        <div class="post-title">${zh ? post.title_zh : post.title_en}</div>
        <div class="post-teaser">${zh ? post.teaser_zh : post.teaser_en}</div>
        <div class="post-cta">${T[lang].readmore}</div>
      </div>`;
    list.appendChild(a);
  });
  // 桌機版分類橫排(手機版CSS整塊隱藏,不影響手機版面)
  list.appendChild(buildCatRows(posts, lang));
  setupRowNav();
  setupScrollReveal();
}

/* ═══ 分類橫排(桌機) ═══
   前台分類對照表:依 tag_en 把文章歸到各排,posts.json 的 tag 不用動。
   每排的 slug 是固定英文代號,之後做分類列表(網址參數或獨立頁)都用它。
   要拆排、併排、改名,只改這張表。
   不在表內的新 tag 會自動自成一排,文章不會消失。 */
const CAT_GROUPS = [
  { slug: 'psychology',    en: 'Investor Psychology',  zh: '投資心理',   tags: ['Mindset', 'Behavior'] },
  { slug: 'strategy',      en: 'Strategy & Valuation', zh: '策略與估值', tags: ['Strategy', 'Valuation', 'Value Investing'] },
  { slug: 'markets',       en: 'Market Watch',         zh: '市場觀察',   tags: ['Markets', 'Gold'] },
  { slug: 'cost-of-money', en: 'The Cost of Money',    zh: '錢的代價',   tags: ['The Cost of Money'], series: true }
];
// 每排最多先顯示幾篇;超過時最後放「查看全部」入口卡。
// 分類列表頁還沒做之前,入口卡在原排展開其餘文章,不會變成死連結。
const ROW_MAX = 10;

function catSlug(text) {
  return String(text || 'other').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'other';
}

function groupPostsByCat(posts) {
  const groups = new Map();
  CAT_GROUPS.forEach(g => groups.set(g.slug, Object.assign({}, g, { posts: [] })));
  posts.forEach(post => {
    const tag = post.tag_en || '';
    let g = CAT_GROUPS.find(x => x.tags.indexOf(tag) !== -1);
    if (!g) {
      const slug = catSlug(tag);
      if (!groups.has(slug)) groups.set(slug, { slug: slug, en: post.tag_en || 'Other', zh: post.tag_zh || post.tag_en || '其他', tags: [tag], posts: [] });
      g = groups.get(slug);
    }
    groups.get(g.slug).posts.push(post);
  });
  // 排內新到舊;排與排之間依「該排最新一篇的日期」排序,有新文章的分類自動上浮
  const rows = Array.from(groups.values()).filter(g => g.posts.length);
  rows.forEach(g => g.posts.sort((a, b) => String(b.date).localeCompare(String(a.date))));
  rows.sort((a, b) => String(b.posts[0].date).localeCompare(String(a.posts[0].date)));
  return rows;
}

function postThumb(post) {
  return /^https?:\/\//.test(post.hero_image)
    ? post.hero_image
    : '/' + String(post.hero_image).replace(/^\/+/, '');
}

function buildRowCard(post, lang, i) {
  const zh = lang === 'zh';
  const title = zh ? post.title_zh : post.title_en;
  const thumb = postThumb(post);
  const a = document.createElement('a');
  a.className = 'row-card';
  a.style.setProperty('--i', Math.min(i, 4));
  /* lang-ok(a):跟平鋪卡片同一套相對路徑,語言自動對上。 */
  a.href = `blog/${post.slug}.html`;
  a.innerHTML = `
    <div class="row-card-media">
      <img class="row-card-blur" src="${thumb}" alt="" aria-hidden="true" loading="lazy">
      <img class="row-card-img" src="${thumb}" alt="${title}" loading="lazy">
    </div>
    <div class="row-card-body">
      <div class="row-card-meta">
        <span class="row-card-tag">${zh ? post.tag_zh : post.tag_en}</span>
        <span>${post.date}</span>
        <span>${post.read_time} min</span>
      </div>
      <div class="row-card-text"><span class="row-card-title">${title}</span><br><span class="row-card-teaser">${zh ? post.teaser_zh : post.teaser_en}</span></div>
    </div>`;
  return a;
}

function buildCatRows(posts, lang) {
  const zh = lang === 'zh';
  const t = T[lang];
  const wrap = document.createElement('div');
  wrap.className = 'cat-rows';
  groupPostsByCat(posts).forEach(g => {
    const row = document.createElement('section');
    row.className = 'cat-row';
    row.dataset.cat = g.slug;
    const name = zh ? g.zh : g.en;
    row.innerHTML = `
      <div class="cat-row-head">
        <div class="cat-row-label">
          <h2 class="cat-row-title">${name}</h2>
          ${g.series ? `<span class="cat-row-badge">${t.series}</span>` : ''}
        </div>
        <div class="cat-row-nav">
          <button type="button" class="cat-nav-btn" data-dir="-1" aria-label="${t.rowPrev}">←</button>
          <button type="button" class="cat-nav-btn" data-dir="1" aria-label="${t.rowNext}">→</button>
        </div>
      </div>
      <div class="cat-track"></div>`;
    const track = row.querySelector('.cat-track');
    const shown = g.posts.length > ROW_MAX ? g.posts.slice(0, ROW_MAX) : g.posts;
    shown.forEach((post, i) => track.appendChild(buildRowCard(post, lang, i)));
    if (g.posts.length > ROW_MAX) {
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'row-card row-viewall';
      more.style.setProperty('--i', 4);
      more.innerHTML = `<div class="row-viewall-arrow">→</div><div class="row-viewall-text">${t.viewAll(g.posts.length)}</div>`;
      more.addEventListener('click', () => {
        g.posts.slice(ROW_MAX).forEach(post => {
          const card = buildRowCard(post, lang, 0);
          track.insertBefore(card, more);
        });
        more.remove();
        updateRowNav(row);
      });
      track.appendChild(more);
    }
    wrap.appendChild(row);
  });
  return wrap;
}

// 左右箭頭:一次捲動約3張卡片的距離;滑到兩端時對應箭頭變淡;
// 卡片數量不足以滑動(例如只有2篇)時整組箭頭隱藏。
function updateRowNav(row) {
  const track = row.querySelector('.cat-track');
  const nav = row.querySelector('.cat-row-nav');
  if (!track || !nav) return;
  const max = track.scrollWidth - track.clientWidth;
  nav.classList.toggle('is-hidden', max <= 2);
  nav.querySelector('[data-dir="-1"]').disabled = track.scrollLeft <= 2;
  nav.querySelector('[data-dir="1"]').disabled = track.scrollLeft >= max - 2;
}
function setupRowNav() {
  document.querySelectorAll('.cat-row').forEach(row => {
    const track = row.querySelector('.cat-track');
    row.querySelectorAll('.cat-nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = track.querySelector('.row-card');
        const step = card ? (card.getBoundingClientRect().width + 20) * 3 : track.clientWidth;
        track.scrollBy({ left: step * Number(btn.dataset.dir), behavior: 'smooth' });
      });
    });
    let ticking = false;
    track.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { updateRowNav(row); ticking = false; });
    }, { passive: true });
    updateRowNav(row);
  });
}
window.addEventListener('resize', () => {
  clearTimeout(window._rowNavTimer);
  window._rowNavTimer = setTimeout(() => document.querySelectorAll('.cat-row').forEach(updateRowNav), 150);
});

// 桌機限定(手機版CSS完全沒有.reveal相關規則,這裡在手機上是安全的no-op,
// 只是白白加class沒有視覺效果)。新增,跟Henry確認過:這裡「每次」
// 捲過去都要重播淡入+浮起動畫,不是像本週精選那樣整次造訪只演一次——
// 因為這裡只有主打+兩兩幾張大卡片,數量少,重播不會有「太吵」的問題。
// 做法:進畫面加.reveal、離開畫面拿掉.reveal,離開後class被清空,
// 下次再進來CSS transition會重新從頭播放一次。
let _postsRevealObserver = null;
function setupScrollReveal() {
  if (typeof IntersectionObserver === 'undefined') {
    // 不支援的環境,安全降級:直接顯示,不做動畫
    document.querySelectorAll('.post-card, .cat-row').forEach(el => el.classList.add('reveal'));
    return;
  }
  if (_postsRevealObserver) _postsRevealObserver.disconnect();
  _postsRevealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      entry.target.classList.toggle('reveal', entry.isIntersecting);
    });
  }, { threshold: 0.2 });
  // 主打卡+每一排(排進畫面時,排內卡片依序浮現)
  document.querySelectorAll('.post-card, .cat-row').forEach(el => _postsRevealObserver.observe(el));
}

async function loadPosts() {
  try {
    /* 改成絕對路徑。原本寫 'blog/index.json',在 /zh/insights.html
       會被解析成 /zh/blog/index.json(不存在)→ 抓失敗 → 整份清單變空狀態。
       index.json 只在 blog/ 產一份,中英共用,所以一律走根目錄。 */
    const res = await fetch('/blog/index.json?v=' + Date.now());
    if(!res.ok) throw new Error('Failed');
    allPosts = await res.json();
    renderPosts(allPosts, currentLang);
  } catch(e) {
    document.getElementById('postsList').innerHTML = `<div class="empty">${T[currentLang].empty}</div>`;
  }
}

// 桌機限定(新增):標題捲動遮蓋效果的實際px數值——nav高度、
// page-hero實際渲染高度(中英文文字長度不同,不能寫死)——這裡動態量測,
// 比照全站既有syncNavOffset()同一套模式(見index.html)。手機版<960明確
// 清空inline style,避免視窗縮小時殘留桌機數值污染手機版版面。
function syncHeroCover() {
  const hero = document.querySelector('.page-hero');
  const list = document.getElementById('postsList');
  if (!hero || !list) return;
  if (window.innerWidth < 960) {
    hero.style.top = '';
    list.style.marginTop = '';
    hero.style.transform = '';
    hero.style.opacity = '';
    return;
  }
  const nav = document.querySelector('#siteHeader nav') || document.querySelector('nav');
  const navH = nav ? nav.getBoundingClientRect().height : 0;
  hero.style.top = navH + 'px';
  // page-hero此時已經是position:fixed,量它的版面原始高度(padding都算在內)。
  // 修正:必須用offsetHeight,不能用getBoundingClientRect()——後者會算進
  // onHeroScroll()加上的scale縮小。iOS Safari捲動時網址列收放會觸發resize,
  // 若在捲動途中重新量測,會量到縮小後的高度,marginTop被算小,
  // 捲回頂端時第一張大圖就會停在太高的位置、蓋住副標。
  const heroH = hero.offsetHeight;
  list.style.marginTop = (navH + heroH) + 'px';
  // 縮小效果的行程距離抓跟遮蔽效果同一個基準(heroH),確保「同步」——
  // 捲到heroH這個距離時,字體縮小跟被蓋住剛好同時走完,不是各走各的。
  _heroCoverDistance = heroH || 300;
  onHeroScroll();
}
let heroCoverResizeTimer = null;
function debouncedSyncHeroCover() {
  clearTimeout(heroCoverResizeTimer);
  heroCoverResizeTimer = setTimeout(syncHeroCover, 150);
}
window.addEventListener('resize', debouncedSyncHeroCover);
window.addEventListener('orientationchange', () => setTimeout(syncHeroCover, 100));

// 桌機限定(新增,跟Henry確認過):字體階段性縮小,跟主卡往上
// 遮蔽「同步發生」——捲動位置直接1:1連動縮放比例跟透明度,不是分開的
// 兩套動畫各走各的。用requestAnimationFrame節流,避免捲動時掉幀卡頓。
let _heroCoverDistance = 300;
function onHeroScroll() {
  const hero = document.querySelector('.page-hero');
  if (!hero || window.innerWidth < 960) return;
  const progress = Math.max(0, Math.min(1, window.scrollY / _heroCoverDistance));
  hero.style.transform = `scale(${(1 - progress * 0.24).toFixed(3)})`;
  hero.style.opacity = (1 - progress).toFixed(3);
}
let _heroScrollTicking = false;
window.addEventListener('scroll', () => {
  if (window.innerWidth < 960) return;
  if (!_heroScrollTicking) {
    _heroScrollTicking = true;
    requestAnimationFrame(() => { onHeroScroll(); _heroScrollTicking = false; });
  }
}, { passive: true });

// chrome.js非同步注入nav,量測要等它真的插入DOM後才準——用短暫輪詢等待,
// 比起猜測一個固定的setTimeout毫秒數更保險。
function waitForNavThenSync(triesLeft) {
  const nav = document.querySelector('#siteHeader nav');
  if (nav || triesLeft <= 0) { syncHeroCover(); return; }
  setTimeout(() => waitForNavThenSync(triesLeft - 1), 50);
}
waitForNavThenSync(20);
// 字型載入完成後標題行高可能改變,再量測一次,確保hero高度以最終字型為準。
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(syncHeroCover);
}


// Init — 語言由共用 chrome 管;本頁只重繪自己的內文
window.applyPageLang = function(lang){ currentLang = (lang === "zh") ? "zh" : "en"; applyLang(currentLang); };
applyLang(currentLang);
loadPosts();
</script>
<script src="/chrome.js?v=5"></script>
</body>
