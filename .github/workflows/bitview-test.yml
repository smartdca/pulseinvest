name: Bitview test (temporary)
on:
  push:
    branches: [bitview-test]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Bitview API
        run: |
          B=https://bitview.space/api
          for s in price mvrv realized_price supply_in_profit_share sth_realized_price puell_multiple nupl; do
            echo "=== $s day1: $(curl -sS -m 30 "$B/series/$s/day1/latest" | head -c 200)"
          done
