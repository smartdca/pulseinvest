name: Thermo Test

on:
  schedule:
    - cron: "0 0 * * *"    # 台北 08:00
    - cron: "0 6 * * *"    # 台北 14:00
    - cron: "0 14 * * *"   # 台北 22:00
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests gspread google-auth openpyxl

      - name: Run test
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python scripts/thermo_test.py
