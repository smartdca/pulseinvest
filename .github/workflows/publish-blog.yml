name: Publish Blog

on:
  schedule:
    - cron: '0 1 * * 3'   # Wednesday
    - cron: '0 1 * * 6'   # Saturday

  push:
    branches:
      - main
    paths:
      - 'posts.json'
      - 'generate blog.py'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate blog pages
        run: python "generate blog.py"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog zh/blog chrome.js sitemap.xml
          git diff --staged --quiet || git commit -m "chore: publish blog $(date -u +'%Y-%m-%d')"
          git push
