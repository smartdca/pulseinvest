name: Update Analyst

# 資產頁「華爾街，這樣看。」卡片的資料(analyst.json)。
# 每個美股交易日收盤後跑一次;assets.js 有變動(新增資產)時也會立刻補抓。
on:
  schedule:
    - cron: '17 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'assets.js'
      - 'scripts/update_analyst.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-analyst
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: 抓取分析師資料
        run: python3 scripts/update_analyst.py

      # always():部分資產抓取失敗時,腳本會在寫完 analyst.json 之後以非零代碼結束
      # (讓 Actions 顯示紅叉提醒),這一步仍要執行,抓到的部分才會更新上去。
      # 推送被拒(同時有其他流程推送)時,先同步最新的 main 再推,最多試三次。
      - name: 提交結果
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analyst.json || true
          if git diff --staged --quiet; then
            echo "沒有變化,不需要 commit"
            exit 0
          fi
          git commit -m "chore: update analyst data"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
