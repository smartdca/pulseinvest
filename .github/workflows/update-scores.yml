name: Update Scores

# 首頁人氣熱搜、泡泡頁、資產頁相關卡讀的分數檔(scores.json)。
# 每個美股交易日收盤後跑一次(主要由 cron-job.org 觸發 workflow_dispatch,
# 下面的 schedule 是備援);assets.js 有變動(新增資產)時也會立刻補抓。
# 這支不回報計數器,計數只在訪客瀏覽器裡發生(見 scripts/update_scores.py 開頭)。
on:
  schedule:
    - cron: '33 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'assets.js'
      - 'scripts/update_scores.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取分數
        run: python3 scripts/update_scores.py

      # always():部分資產失敗時仍要把抓到的部分提交上去。
      # 推送被拒(同時有其他流程推送)時,先同步最新的 main 再推,最多試三次。
      - name: 提交結果
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json || true
          if git diff --staged --quiet; then
            echo "沒有變化,不需要 commit"
            exit 0
          fi
          git commit -m "chore: update scores"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
