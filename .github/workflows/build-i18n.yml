name: Build i18n (asset pages)

on:
  push:
    branches: [main]
    paths:
      - 'asset/**.html'
      - 'trending.html'
      - 'insights.html'
      - 'privacy.html'
      - 'scripts/build-i18n.py'
      - '.github/workflows/build-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-i18n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 產生中文版頁面
        run: python3 scripts/build-i18n.py

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zh chrome.js sitemap.xml
          if git diff --staged --quiet; then
            echo "沒有變化,不需要 commit"
          else
            git commit -m "build: 自動產生中文版頁面"
            git push
          fi
